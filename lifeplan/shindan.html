<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幸せ経営診断</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 1カラムの3ステップ入力 → 結果。帯の主役数字・信号のカード・レーダーで「気づき」を渡す */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --surface-2: #eef2f5; --ink: #1a2430; --muted: #5b6878; --line: #d9e0e7;
  --accent: #0e6b66; --accent-soft: #d6ecea; --good: #2c8a55; --warn: #b97c08; --bad: #be3d36;
  --hero1: #0e6b66; --hero2: #0b4a5a; --on-hero: #ffffff;
  --n-survival: #3e9356; --n-love: #c9507a; --n-power: #cf7f12; --n-freedom: #2f7fc1; --n-fun: #8259c4;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #17202a; --surface-2: #1e2935; --ink: #e5ebf1; --muted: #98a6b5; --line: #2b3745;
    --accent: #4cbcb3; --accent-soft: #173836; --good: #5cc08a; --warn: #e2ad3f; --bad: #ec7069;
    --hero1: #145a55; --hero2: #10384a; --on-hero: #f2f7f7;
    --n-survival: #6cc184; --n-love: #ec7fa3; --n-power: #f0a64a; --n-freedom: #6aaee6; --n-fun: #ab8ce6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #17202a; --surface-2: #1e2935; --ink: #e5ebf1; --muted: #98a6b5; --line: #2b3745;
  --accent: #4cbcb3; --accent-soft: #173836; --good: #5cc08a; --warn: #e2ad3f; --bad: #ec7069;
  --hero1: #145a55; --hero2: #10384a; --on-hero: #f2f7f7;
  --n-survival: #6cc184; --n-love: #ec7fa3; --n-power: #f0a64a; --n-freedom: #6aaee6; --n-fun: #ab8ce6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.65; }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: .84rem; }
.eyebrow { font-size: .75rem; letter-spacing: .1em; color: var(--accent); font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { appearance: none; font: inherit; font-size: .84rem; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 5px 14px 5px 6px; display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.step span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); font-weight: 700; font-size: .75rem; }
.step[aria-current="step"] { border-color: var(--accent); color: var(--ink); font-weight: 700; }
.step[aria-current="step"] span, .step.done span { background: var(--accent); color: var(--surface); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
label.f { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); }
label.f small { font-size: .74rem; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
input[type="number"] { text-align: right; font-variant-numeric: tabular-nums; }
input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.need { display: grid; grid-template-columns: 110px minmax(0, 1fr) 44px; gap: 10px; align-items: center; }
.need b { display: inline-flex; gap: 6px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.need input[type="range"] { accent-color: var(--accent); padding: 0; border: 0; background: none; }
.need .v { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.need-hint { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); margin-top: -6px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.btn { appearance: none; font: inherit; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 18px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.ghost { border-color: transparent; color: var(--muted); font-weight: 500; }
.hero { background: linear-gradient(140deg, var(--hero1), var(--hero2)); color: var(--on-hero); border-radius: 18px; padding: 22px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -70px; top: -70px; width: 220px; height: 220px; border-radius: 50%; border: 30px solid currentColor; opacity: .06; pointer-events: none; }
.ring { --p: 0; width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(var(--on-hero) calc(var(--p) * 1%), rgba(255, 255, 255, .18) 0); display: grid; place-items: center; }
.ring span { width: 94px; height: 94px; border-radius: 50%; background: var(--hero2); display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 2rem; font-weight: 700; }
.ring small { font-size: .8rem; opacity: .75; }
.hero h2 { color: inherit; }
.hero p { opacity: .88; font-size: .9rem; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 600px) { .tiles { grid-template-columns: 1fr; } .hero { grid-template-columns: 1fr; justify-items: start; } }
.tile { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.tile.good { border-top-color: var(--good); } .tile.warn { border-top-color: var(--warn); } .tile.bad { border-top-color: var(--bad); }
.tile .lab { font-size: .8rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.tile .val { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
.tile .val small { font-size: .8rem; color: var(--muted); font-weight: 500; }
.word { font-size: .72rem; font-weight: 700; }
.good .word { color: var(--good); } .warn .word { color: var(--warn); } .bad .word { color: var(--bad); }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 4px; background: var(--good); }
.warn .meter span { background: var(--warn); } .bad .meter span { background: var(--bad); }
.finds { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.finds li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.tag { font-size: .72rem; font-weight: 700; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); } .tag.good { color: var(--good); } .tag.info { color: var(--accent); }
.finds strong { display: block; }
.two { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 18px; align-items: center; }
@media (max-width: 600px) { .two { grid-template-columns: 1fr; } }
svg text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
svg .gl { stroke: var(--line); fill: none; }
.themes { counter-reset: t; display: grid; gap: 10px; }
.theme { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.theme::before { counter-increment: t; content: counter(t); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.cta { border: 2px solid var(--accent); }
.office { white-space: pre-wrap; font-size: .9rem; }
.banner { font-size: .82rem; background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 8px 12px; display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
details summary { cursor: pointer; color: var(--muted); font-size: .84rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .85rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
/* 本格版：進捗バー・6分野のカード・指標表・チェックリスト */
.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s; }
@media (prefers-reduced-motion: reduce) { .progress span { transition: none; } }
.grade { display: inline-grid; place-items: center; min-width: 44px; height: 44px; padding: 0 10px; border-radius: 12px; background: rgba(255, 255, 255, .16); font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; }
.areas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.area { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; background: var(--surface); }
.area.good { border-left-color: var(--good); } .area.warn { border-left-color: var(--warn); } .area.bad { border-left-color: var(--bad); }
.area .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.area .sc { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.area .sc small { font-size: .75rem; color: var(--muted); font-weight: 500; }
.area ul { margin: 0; padding-left: 1.1em; font-size: .82rem; color: var(--muted); display: grid; gap: 2px; }
.mt { width: 100%; min-width: 600px; border-collapse: collapse; font-size: .86rem; }
.mt td:first-child { min-width: 13em; }
.mt-goal { display: none; color: var(--muted); font-size: .74rem; }
@media (max-width: 600px) { .mt { min-width: 0; } .mt td:first-child { min-width: 0; } .mt .g { display: none; } .mt-goal { display: block; } .mt th, .mt td { padding: 8px 6px; } }
.mt th, .mt td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.mt th { font-size: .76rem; color: var(--muted); font-weight: 500; white-space: nowrap; }
.mt td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mt td.grp { background: var(--surface-2); font-weight: 700; font-size: .8rem; }
.mt-wrap { overflow-x: auto; min-width: 0; }
.chk { display: grid; gap: 8px; }
.chk label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: .9rem; }
.chk input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.chk small { display: block; color: var(--muted); font-size: .76rem; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .84rem; }
.bar-row .track { height: 14px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar-row .track span { display: block; height: 100%; border-radius: 4px; }
.bar-row b { font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { .bar-row { grid-template-columns: 1fr auto; } .bar-row .track { grid-column: 1 / -1; grid-row: 2; } }
.first-step { font-size: .8rem; color: var(--accent); font-weight: 700; margin-top: 4px; }
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const NEEDS = [
  ['survival', '生存', '健康・お金・将来の安心', 'var(--n-survival)'],
  ['love', '愛・所属', '家族・仲間・社員とのつながり', 'var(--n-love)'],
  ['power', '力', '達成感・認められること・成長', 'var(--n-power)'],
  ['freedom', '自由', '自分の時間・自分で決められること', 'var(--n-freedom)'],
  ['fun', '楽しみ', '学び・趣味・好奇心', 'var(--n-fun)'],
];
const AREAS = [['fin', '財務の安全性'], ['profit', '収益力と生産性'], ['life', '人生とお金の安心'], ['exit', '承継・出口の準備'], ['org', '組織と人'], ['happy', '社長の5つの欲求']];
const EXIT_CHK = [
  ['talk', '後継者や幹部と、承継の時期を話し合っている', '「いつ・誰に・どう渡すか」を言葉にして共有している'],
  ['value', '自社株の評価額（相続税評価・売却価格の目安）を知っている', '直近2年以内に計算したもの'],
  ['transfer', '株の移し方（贈与・譲渡・事業承継税制など）を検討した', '税理士と一度でも話した'],
  ['guarantee', '社長個人の借入保証を外す準備をしている', '金融機関と話した、または条件を知っている'],
  ['away', '社長が1か月いなくても、会社が回る', '受注・現場・資金繰りが止まらない'],
];
const STEPS = ['会社の数字', '収益と組織', '社長の人生', '承継と出口', '5つの欲求'];
const RESULT = STEPS.length;
const EXAMPLE = { company: '', industry: '建設業', sales: 50000, prevSales: 52000, gp: 14000, op: 1800, cash: 4500, debt: 12000, equity: 9000, assets: 32000,
  employees: 25, payroll: 8400, leavers: 3, direct: 5, managers: 1,
  age: 62, inYears: 25, retire: 70, comp: 1200, living: 900, savings: 3000, pension: 220, prepared: false,
  successor: '未定', chk: { talk: false, value: true, transfer: false, guarantee: false, away: false },
  needs: { survival: 6, love: 7, power: 7, freedom: 3, fun: 4 } };
const blank = () => ({ company: '', industry: '建設業', sales: null, prevSales: null, gp: null, op: null, cash: null, debt: null, equity: null, assets: null,
  employees: null, payroll: null, leavers: null, direct: null, managers: null,
  age: null, inYears: null, retire: 70, comp: null, living: null, savings: null, pension: 200, prepared: false,
  successor: '未定', chk: { talk: false, value: false, transfer: false, guarantee: false, away: false },
  needs: { survival: 5, love: 5, power: 5, freedom: 5, fun: 5 } });
let d = JSON.parse(JSON.stringify(EXAMPLE)), isExample = true, step = 0;
let office = { name: '', person: '', contact: '' };
try { const o = JSON.parse(localStorage.getItem('shindan-office')); if (o) office = o; } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = v => v == null || v === '' || isNaN(+v) ? 0 : +v;
const has = v => v != null && v !== '' && !isNaN(+v);
const man = v => Math.round(n0(v)).toLocaleString('ja-JP') + '万円';
const pct = (v, k = 1) => isFinite(v) ? v.toFixed(k) + '%' : '—';
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); };
const tone = (v, g, w) => v >= g ? 'good' : v >= w ? 'warn' : 'bad';
const word = t => ({ good: '良好', warn: '注意', bad: '要対策', info: '参考' }[t]);

function calc() {
  const sales = n0(d.sales), op = n0(d.op), cash = n0(d.cash), debt = n0(d.debt), eq = n0(d.equity), assets = n0(d.assets), gp = n0(d.gp);
  // 財務の安全性：自己資本比率・債務償還年数・手元資金・営業利益率（各25点）
  const er = assets ? eq / assets * 100 : NaN, cf = op * 0.7, net = debt - cash;
  const repay = net <= 0 ? 0 : cf > 0 ? net / cf : Infinity;
  const liq = sales ? cash / (sales / 12) : NaN, margin = sales ? op / sales * 100 : NaN;
  const pE = !isFinite(er) ? 0 : er >= 40 ? 25 : er >= 30 ? 20 : er >= 20 ? 15 : er >= 10 ? 8 : er > 0 ? 3 : 0;
  const pR = repay === 0 ? 25 : !isFinite(repay) ? 0 : repay <= 3 ? 25 : repay <= 5 ? 20 : repay <= 10 ? 12 : repay <= 15 ? 5 : 0;
  const pL = !isFinite(liq) ? 0 : liq >= 3 ? 25 : liq >= 2 ? 20 : liq >= 1.5 ? 15 : liq >= 1 ? 8 : 2;
  const pM = !isFinite(margin) ? 0 : margin >= 8 ? 25 : margin >= 5 ? 20 : margin >= 3 ? 15 : margin >= 1 ? 8 : margin > 0 ? 4 : 0;
  const fin = pE + pR + pL + pM;
  const bank = fin >= 75 ? '正常先（上位）' : fin >= 55 ? '正常先' : fin >= 35 ? '正常先（下位）〜要注意先' : '要注意先の可能性';
  // 収益力と生産性：売上の伸び・1人あたり粗利・労働分配率
  const growth = has(d.prevSales) && n0(d.prevSales) ? (sales / n0(d.prevSales) - 1) * 100 : NaN;
  const gpr = sales && gp ? gp / sales * 100 : NaN;
  const emp = n0(d.employees), prod = emp && gp ? gp / emp : NaN;
  const share = gp ? (n0(d.payroll) + n0(d.comp)) / gp * 100 : NaN;
  const pG = !isFinite(growth) ? 0 : growth >= 5 ? 25 : growth >= 0 ? 18 : growth >= -5 ? 10 : 3;
  const pP = !isFinite(prod) ? 0 : prod >= 1000 ? 25 : prod >= 800 ? 20 : prod >= 600 ? 14 : prod >= 400 ? 8 : 3;
  const pS = !isFinite(share) || !has(d.payroll) ? 0 : share <= 50 ? 25 : share <= 60 ? 18 : share <= 70 ? 10 : 4;
  const profit = Math.round((pG + pP + pS) / 75 * 100);
  // 人生とお金：必要な役員報酬、老後資金、役員退職金（最終報酬月額×在任年数×功績倍率2.0、手取り85%）
  const age = n0(d.age), retire = Math.max(age + 1, n0(d.retire) || 70), years = Math.max(0, 90 - retire), work = Math.max(1, retire - age);
  const allowance = n0(d.comp) / 12 * (n0(d.inYears) + work) * 2.0, allowNet = allowance * 0.85;
  const oldNeed = Math.max(0, (n0(d.living) * 0.7 - n0(d.pension)) * years);
  const funds = n0(d.savings) + (d.prepared ? allowNet : 0);
  const oldGap = Math.max(0, oldNeed - funds), gapIfPrepared = Math.max(0, oldNeed - n0(d.savings) - allowNet);
  const saveYear = oldGap / work, needComp = (n0(d.living) + saveYear) / 0.7, compGap = n0(d.comp) - needComp;
  const life = needComp ? Math.round(Math.max(0, Math.min(100, n0(d.comp) / needComp * 100))) : 0;
  // 承継・出口：後継者＋5項目
  const yes = (d.successor === 'あり' ? 1 : 0) + EXIT_CHK.filter(([k]) => d.chk[k]).length;
  const exit = Math.round(yes / (EXIT_CHK.length + 1) * 100);
  const value = Math.max(0, eq + Math.max(0, op) * 3), saleNet = value * (1 - 0.20315);
  const succession = age >= 60 && d.successor !== 'あり';
  // 組織と人：社長に直接報告する人数・離職率・幹部候補
  const turnover = emp && has(d.leavers) ? n0(d.leavers) / emp * 100 : NaN;
  const pD = !has(d.direct) ? 0 : n0(d.direct) <= 3 ? 35 : n0(d.direct) <= 5 ? 20 : 8;
  const pT = !isFinite(turnover) ? 0 : turnover <= 5 ? 35 : turnover <= 10 ? 25 : turnover <= 15 ? 12 : 4;
  const pK = !has(d.managers) ? 0 : n0(d.managers) >= 2 ? 30 : n0(d.managers) >= 1 ? 18 : 5;
  const org = pD + pT + pK, orgHeavy = n0(d.direct) >= 4;
  const nv = NEEDS.map(([k]) => n0(d.needs[k])), happy = Math.round(nv.reduce((a, b) => a + b, 0) / 5 * 10);
  const low = NEEDS.map(([k, l], i) => ({ k, l, v: nv[i] })).sort((a, b) => a.v - b.v)[0];
  const scores = { fin, profit, life, exit, org, happy };
  const total = Math.round(fin * 0.2 + profit * 0.15 + life * 0.2 + exit * 0.15 + org * 0.15 + happy * 0.15);
  const grade = total >= 85 ? 'S' : total >= 70 ? 'A' : total >= 55 ? 'B' : total >= 40 ? 'C' : 'D';
  return { er, repay, liq, margin, fin, bank, growth, gpr, prod, share, profit, retire, years, work, allowance, allowNet, oldNeed, funds, oldGap, gapIfPrepared, needComp, compGap, life,
    yes, exit, value, saleNet, succession, turnover, org, orgHeavy, happy, low, scores, total, grade };
}

function radarSvg(axes, vals, max, size, label) {
  const n = axes.length, pad = 52, r = size / 2 - pad, c = size / 2;
  const pt = (i, v) => { const a = (-90 + i * 360 / n) * Math.PI / 180; return [c + Math.cos(a) * r * v / max, c + Math.sin(a) * r * v / max]; };
  let s = `<svg viewBox="0 0 ${size} ${size}" style="width:100%;height:auto;max-width:${size + 20}px" role="img" aria-label="${label}">`;
  [0.2, 0.4, 0.6, 0.8, 1].forEach(f => { s += `<polygon class="gl" points="${axes.map((_, i) => pt(i, max * f).join(',')).join(' ')}"/>`; });
  axes.forEach(([, l, col], i) => { const [x, y] = pt(i, max); s += `<line class="gl" x1="${c}" y1="${c}" x2="${x}" y2="${y}"/>`; const a = (-90 + i * 360 / n) * Math.PI / 180; s += `<text x="${c + Math.cos(a) * (r + 24)}" y="${c + Math.sin(a) * (r + 18) + 4}" text-anchor="middle" style="fill:var(--ink);font-size:11.5px;font-weight:700">${l}</text>`; });
  s += `<polygon points="${axes.map((_, i) => pt(i, vals[i]).join(',')).join(' ')}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2"/>`;
  axes.forEach(([, , col], i) => { const [x, y] = pt(i, vals[i]); s += `<circle cx="${x}" cy="${y}" r="4.5" fill="${col || 'var(--accent)'}" stroke="var(--surface)" stroke-width="2"/>`; });
  return s + '</svg>';
}

function priorities(c) {
  const s = c.scores, cand = [];
  if (c.compGap < 0) cand.push([s.life, 'ライフプランから逆算した経営計画', `このままでは、引退までの${c.work}年で老後資金が約 ${man(c.oldGap)} 不足します。必要な役員報酬は年 ${man(c.needComp)}（今より ${man(-c.compGap)} 多い）です。`, 'ご家族のこの先10年の予定（進学・住宅・旅行・介護）を書き出す']);
  if (!d.prepared && c.allowance > 0) cand.push([s.life + 5, '役員退職金の準備', `在任年数から見た役員退職金の目安は約 ${man(c.allowance)}。準備すれば老後の不足は ${man(c.gapIfPrepared)} まで減ります。${c.allowance > n0(d.cash) ? '今の手元資金では払いきれない金額です。' : ''}`, '退職金規程の有無と、財源（保険・積立）を確認する']);
  if (c.exit < 60 || c.succession) cand.push([s.exit, '事業承継と出口の設計', `${n0(d.age)}歳で、承継の準備は ${c.yes}/${EXIT_CHK.length + 1} 項目。準備には一般に5〜10年かかり、遅れるほど選べる道（親族・社員・M&A）が減ります。`, '自社株の評価額を出し、親族承継とM&Aの手取りを比べる']);
  if (c.fin < 55) cand.push([s.fin, '銀行格付けの改善と資金繰り', `金融機関の評価は「${c.bank}」の目安。借入を返す年数は ${isFinite(c.repay) ? c.repay.toFixed(1) + '年' : '利益で返せない状態'}です。金利の上昇や追加融資の条件に響きます。`, '銀行別・融資別の返済予定表をつくる']);
  if (c.profit < 55) cand.push([s.profit, '粗利と人件費のバランス', `${isFinite(c.share) ? `労働分配率は ${pct(c.share)}。` : ''}${isFinite(c.prod) ? `社員1人あたり粗利は ${man(c.prod)}。` : ''}賃上げの余力が小さいと、採用と定着が難しくなります。`, '商品・現場ごとの粗利を出し、伸ばす仕事と断る仕事を決める']);
  if (c.org < 55 || c.orgHeavy) cand.push([s.org, '理想の組織図と幹部の育成', `社長に直接報告する人が${n0(d.direct)}人、判断を任せられる幹部は${n0(d.managers)}人。社長が抜けると回らない会社は、承継でもM&Aでも評価が下がります。`, '社長の仕事を書き出し、幹部に任せる3つを決める']);
  if (c.low.v <= 4) cand.push([s.happy, `「${c.low.l}」の欲求を満たす働き方`, `${c.low.l}が${c.low.v}点。会社の数字が良くても、ここが満たされないと社長の幸せは続きません。`, c.low.k === 'freedom' ? '来月、仕事を入れない日を1日決める' : c.low.k === 'fun' ? '学びや趣味の時間を毎週の予定に入れる' : c.low.k === 'love' ? '家族・社員と話す時間を予定に入れる' : c.low.k === 'survival' ? '健康診断と、お金の不安を数字で確かめる' : '今年の目標を一つ決め、毎月振り返る']);
  return cand.sort((a, b) => a[0] - b[0]).slice(0, 3);
}

    <p class="small">この診断は、入力いただいた数字だけで計算した目安です。面談では、決算書3期分と人生の予定（進学・住宅・承継・引退）をもとに、必要な報酬から逆算した経営計画、理想の組織図と人件費、銀行・保険・承継の打ち手を具体的にお示しします。</p>
    ${office.name || office.person || office.contact ? `<div class="office"><strong>${esc(office.name)}</strong>${office.person ? `\n担当：${esc(office.person)}` : ''}${office.contact ? `\n${esc(office.contact)}` : ''}</div>` : ''}
    <div class="btns"><button class="btn" data-go="0">入力を見直す</button><button class="btn primary" data-act="save">診断結果を保存（HTML）</button></div></div>
  <details class="card"><summary>事務所の設定（診断を使う側が入力）</summary>
    <div class="grid2"><label class="f">事務所名<input id="of-name" data-of="name" value="${esc(office.name)}"></label><label class="f">担当者名<input id="of-person" data-of="person" value="${esc(office.person)}"></label></div>
    <label class="f">連絡先（電話・メールなど、表示用）<textarea id="of-contact" data-of="contact" rows="2">${esc(office.contact)}</textarea></label>
    <p class="small muted">ここで入れた内容は、結果画面と保存するレポートの最後に表示されます。このブラウザにだけ保存されます。</p>
    <p class="small muted">保存した結果ファイルは、幸せ経営コンパスの「データ」画面にある「無料診断の結果を取り込む」から、そのまま新しい顧問先として登録できます。</p></details>
  <p class="small muted">計算の前提：役員報酬の手取りは7割、引退後の生活費は今の7割で90歳まで。財務の点数は自己資本比率・債務償還年数（営業利益の7割で返済する前提）・手元資金・営業利益率の4項目です。金融機関の評価は実際の格付けではなく、同じ考え方で見た目安です。企業価値は「純資産＋営業利益×3年」の簡易計算で、実際の株価や売却価格とは異なります。</p>`;
}

function render() { $('#app').innerHTML = `<div style="display:grid;gap:6px"><span class="eyebrow">ライフプラン × 経営計画 × 選択理論</span><h1>幸せ経営診断</h1><p class="muted small">5つのステップに答えると、社長の人生と会社の数字を6分野で診断します（所要 約15分）。</p></div>${step < RESULT && isExample ? '<div class="banner"><span>例の数値が入っています。そのまま「次へ」で結果を見られます。</span><button class="btn ghost" data-act="clear">空にして入力する</button></div>' : ''}${viewStep()}`; }

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.need) { d.needs[t.dataset.need] = +t.value; const v = document.getElementById('v-' + t.dataset.need); if (v) v.textContent = t.value; }
  else if (t.dataset.k) { d[t.dataset.k] = t.hasAttribute('data-text') ? t.value : (t.value === '' ? null : +t.value); }
  else if (t.dataset.of) { office[t.dataset.of] = t.value; try { localStorage.setItem('shindan-office', JSON.stringify(office)); } catch (er) {} }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.k && t.tagName === 'SELECT') d[t.dataset.k] = t.value;
  if (t.dataset.chk) { d.chk[t.dataset.chk] = t.checked; isExample = false; }
  if (t.dataset.bool) { d[t.dataset.bool] = t.checked; isExample = false; }
  if (t.dataset.of && step === RESULT) render();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go],[data-act]'); if (!b) return;
  if (b.dataset.go != null) { step = +b.dataset.go; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.act === 'clear') { d = blank(); isExample = false; step = 0; render(); window.scrollTo(0, 0); toast('入力を空にしました'); }
  if (b.dataset.act === 'save') saveReport();
});
document.addEventListener('focusin', e => { if (e.target.dataset && (e.target.dataset.k || e.target.dataset.need)) isExample = false; });

async function saveReport() {
  const css = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n');
  // 幸せ経営コンパスの「データ」画面がこのJSONを読んで顧問先を作る
  const data = JSON.stringify({ kind: 'shiawase-shindan', v: 2, date: new Date().toISOString(), ...d }).replace(/</g, '\\u003c');
  const doc = `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸せ経営診断の結果</title><style>${css}</style></head><body><div class="wrap"><div><span class="eyebrow">幸せ経営診断の結果</span><h1>${esc(d.company || '')}</h1><p class="muted small">${new Date().toLocaleDateString('ja-JP')}</p></div>${result().replace(/<details[\s\S]*?<\/details>/, '').replace(/<div class="btns">[\s\S]*?<\/div>/g, '').replace(/<div class="banner">[\s\S]*?<\/div>/, '')}</div><script type="application/json" id="shindan-data">${data}<\/script></body></html>`;
  const name = `幸せ経営診断_${(d.company || '結果').replace(/\s/g, '')}.html`;
  let dl = null;
  try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch (er) {}
  if (dl) { try { await dl.save({ filename: name, data: doc }); toast('保存しました'); } catch (er) { if (er.code !== 'declined') toast('このビューでは保存できません'); } return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([doc], { type: 'text/html' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('保存しました'); } catch (er) { toast('保存できませんでした'); }
}
render();
})();
</script>
</body>
</html>
