<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幸せ経営コンパス</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 上部に会社名とタブ、下に1カラムのパネル群。数字は表、心は5色の欲求で示す。 */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #eef2f5;
  --ink: #1a2430;
  --muted: #5b6878;
  --line: #d9e0e7;
  --accent: #0e6b66;
  --accent-soft: #d6ecea;
  --good: #2c8a55;
  --warn: #b97c08;
  --bad: #be3d36;
  --n-survival: #3e9356;
  --n-love: #c9507a;
  --n-power: #cf7f12;
  --n-freedom: #2f7fc1;
  --n-fun: #8259c4;
  --c0: #9aa6b2;
  --hero1: #0e6b66;
  --hero2: #0b4a5a;
  --on-hero: #ffffff;
  --c1: #008f80;
  --c2: #d0790a;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #17202a; --surface-2: #1e2935; --ink: #e5ebf1; --muted: #98a6b5; --line: #2b3745;
    --accent: #4cbcb3; --accent-soft: #173836; --good: #5cc08a; --warn: #e2ad3f; --bad: #ec7069;
    --n-survival: #6cc184; --n-love: #ec7fa3; --n-power: #f0a64a; --n-freedom: #6aaee6; --n-fun: #ab8ce6;
    --c0: #5d6b7a; --c1: #26a197; --c2: #c2731c; --hero1: #145a55; --hero2: #10384a; --on-hero: #f2f7f7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #17202a; --surface-2: #1e2935; --ink: #e5ebf1; --muted: #98a6b5; --line: #2b3745;
  --accent: #4cbcb3; --accent-soft: #173836; --good: #5cc08a; --warn: #e2ad3f; --bad: #ec7069;
  --n-survival: #6cc184; --n-love: #ec7fa3; --n-power: #f0a64a; --n-freedom: #6aaee6; --n-fun: #ab8ce6;
  --c0: #5d6b7a; --c1: #26a197; --c2: #c2731c; --hero1: #145a55; --hero2: #10384a; --on-hero: #f2f7f7;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.main { min-width: 0; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; display: grid; gap: 20px; align-content: start; max-width: 1240px; width: 100%; }
#view { display: grid; gap: 20px; min-width: 0; }
.sidenav { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; padding: 18px 14px 24px; }
.sn-brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 8px; }
.sn-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, var(--hero1), var(--hero2)); color: var(--on-hero); flex: none; }
.sn-mark svg { width: 22px; height: 22px; }
.sn-name { display: grid; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
.sn-name small { font-family: var(--font-body); font-size: .58rem; letter-spacing: 0; white-space: nowrap; color: var(--accent); font-weight: 700; }
.sn-client { display: grid; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 10px; font-size: .85rem; }
.sn-client select { width: 100%; }
.sn-client .sn-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sn-client details summary { cursor: pointer; color: var(--muted); font-size: .78rem; }
.sn-client details[open] { display: grid; gap: 6px; }
.sn-nav { display: grid; gap: 14px; }
.sn-group { display: grid; gap: 2px; }
.sn-group > span { font-size: .68rem; letter-spacing: .1em; color: var(--muted); font-weight: 700; padding: 0 10px 4px; }
.sn-item { appearance: none; border: 0; background: none; font: inherit; color: var(--muted); display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; cursor: pointer; text-align: left; font-size: .9rem; }
.sn-item svg { width: 18px; height: 18px; flex: none; }
.sn-item:hover { background: var(--surface-2); color: var(--ink); }
.sn-item[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.sn-item[aria-current="page"] svg { color: var(--accent); }
.icon-btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 40px; height: 40px; border-radius: 10px; display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; fill: none; }
.sn-close, .menu-btn { display: none; }
.sn-close { margin-left: auto; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding-block: 16px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.tb-title { display: grid; min-width: 0; flex: 1; }
.tb-eyebrow { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title h1 { font-size: 1.45rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 22, .45); z-index: 40; }
.bottomnav { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidenav { position: fixed; inset: 0 auto 0 0; z-index: 50; width: min(86vw, 320px); height: 100%; transform: translateX(-105%); transition: transform .22s ease; box-shadow: 0 0 40px rgba(0, 0, 0, .2); padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); }
  .sidenav.open { transform: none; }
  .sn-close, .menu-btn { display: inline-grid; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); gap: 16px; }
  #view { gap: 16px; }
  .topbar { padding-block: 10px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
  .tb-title h1 { font-size: 1.15rem; }
  .topbar .company-chip { display: none; }
  .bottomnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .bottomnav button { appearance: none; border: 0; background: none; font: inherit; font-size: .66rem; color: var(--muted); display: grid; justify-items: center; gap: 3px; padding: 6px 2px; border-radius: 10px; cursor: pointer; }
  .bottomnav button svg { width: 22px; height: 22px; }
  .bottomnav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
  .panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { .sidenav { transition: none; } }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: .02em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

.company-chip { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 500; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.sample { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.good { color: var(--good); }
.pill.warn { color: var(--warn); }
.pill.bad { color: var(--bad); }


.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi .label { font-size: .78rem; color: var(--muted); letter-spacing: .04em; }
.kpi .value { font-size: 1.55rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .sub { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.kpi.good { border-top: 3px solid var(--good); }
.kpi.warn { border-top: 3px solid var(--warn); }
.kpi.bad { border-top: 3px solid var(--bad); }

.table-scroll { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: .78rem; white-space: nowrap; }
thead th { position: sticky; top: 0; background: var(--surface); }
table.wrap-th th { white-space: normal; }
tr.total td { font-weight: 700; border-top: 2px solid var(--ink); }
tr.link td { background: var(--accent-soft); }
td.pos { color: var(--good); }
td.neg { color: var(--bad); }

input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
input[type="number"] { text-align: right; font-variant-numeric: tabular-nums; width: 100%; min-width: 80px; }
textarea { width: 100%; resize: vertical; min-height: 56px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.field { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); }
label.field > input, label.field > select, label.field > textarea { color: var(--ink); font-size: .92rem; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; }

.btn { appearance: none; font: inherit; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.ghost { border-color: transparent; color: var(--muted); padding: 4px 8px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.member-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.member-tab { display: grid; text-align: left; gap: 0; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: inherit; color: var(--ink); }
.member-tab small { color: var(--muted); font-size: .75rem; }
.member-tab[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.need-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; align-items: stretch; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
.hero-main { background: linear-gradient(140deg, var(--hero1), var(--hero2)); color: var(--on-hero); border-radius: 16px; padding: 22px; display: grid; gap: 12px; align-content: start; position: relative; overflow: hidden; }
.hero-main::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; border: 28px solid currentColor; opacity: .06; pointer-events: none; }
.hero-main .meter { background: rgba(255, 255, 255, .18); }
.hero .hero-main .meter > span { background: var(--on-hero); }
.hero-chip { justify-self: start; font-size: .74rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, .16); }
.hero-main .eyebrow { font-size: .78rem; opacity: .8; letter-spacing: .04em; }
.hero-num { font-size: clamp(2.6rem, 6vw, 3.4rem); font-weight: 700; line-height: 1; letter-spacing: -.01em; }
.hero-num small { font-size: 1rem; font-weight: 500; opacity: .75; margin-left: 4px; }
.hero-sub { font-size: .86rem; opacity: .85; }
.hero-sub strong { opacity: 1; }
.hero-mission { font-size: .78rem; opacity: .75; border-top: 1px solid rgba(255, 255, 255, .2); padding-top: 10px; }
.meter { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 5px; background: var(--good); }
.meter.warn > span { background: var(--warn); } .meter.bad > span { background: var(--bad); }
.status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 12px; }
@media (max-width: 560px) { .status-grid { grid-template-columns: 1fr 1fr; gap: 10px; } .status-tile { padding: 10px 11px; } .st-value { font-size: 1.25rem; } .st-word { display: none; } .spark { width: 100%; } .hero-main { padding: 18px; } }
.status-tile { appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; align-content: start; border-top: 4px solid var(--line); transition: transform .12s, box-shadow .12s; }
.status-tile:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0, 0, 0, .08); }
.status-tile.good { border-top-color: var(--good); } .status-tile.warn { border-top-color: var(--warn); } .status-tile.bad { border-top-color: var(--bad); }
.st-head { display: flex; align-items: center; gap: 8px; }
.st-icon { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: .75rem; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.good .st-icon { background: var(--good); color: var(--surface); } .warn .st-icon { background: var(--warn); color: var(--surface); } .bad .st-icon { background: var(--bad); color: var(--surface); }
.st-title { font-weight: 700; font-size: .9rem; }
.st-word { margin-left: auto; font-size: .72rem; font-weight: 700; color: var(--muted); }
.good .st-word { color: var(--good); } .warn .st-word { color: var(--warn); } .bad .st-word { color: var(--bad); }
.st-value { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
.st-value small { font-size: .8rem; font-weight: 500; color: var(--muted); margin-left: 2px; }
.st-sub { font-size: .76rem; color: var(--muted); }
.spark { width: 120px; height: 34px; display: block; }
.dash-chart .hit { cursor: crosshair; }
.dash-chart .hit.on { fill: var(--ink); fill-opacity: .05; }
.legend i.lg-line { width: 16px; height: 0; border-radius: 0; background: none; }
.chart-tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0, 0, 0, .15); font-size: .8rem; display: grid; gap: 3px; min-width: 150px; }
.chart-tip[hidden] { display: none; }
.chart-tip .ct-title { color: var(--muted); font-size: .74rem; margin-bottom: 2px; }
.chart-tip .ct-row { display: grid; grid-template-columns: 14px auto 1fr; gap: 6px; align-items: center; }
.chart-tip .ct-row i { width: 12px; border-top: 2px solid; }
.chart-tip .ct-row span { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .status-tile { transition: none; } .status-tile:hover { transform: none; } }
.chk-hero { display: flex; gap: 20px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.chk-ring { --p: 0; width: 104px; height: 104px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--c1) calc(var(--p) * 1%), var(--surface-2) 0); }
.chk-ring span { width: 80px; height: 80px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 1px; font-size: 1.6rem; font-weight: 700; }
.chk-ring small { font-size: .8rem; color: var(--muted); }
.chk-secs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
@media (max-width: 560px) { .chk-secs { grid-template-columns: 1fr 1fr; gap: 8px; } .chk-sec { padding: 8px 10px; } .chk-sec-name { font-size: .82rem; } }
.chk-sec { appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--good); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.chk-sec.warn { border-left-color: var(--warn); } .chk-sec.bad { border-left-color: var(--bad); }
.chk-sec-name { font-weight: 700; font-size: .9rem; }
.chk-sec-meta { font-size: .76rem; color: var(--muted); }
.chk-group { display: grid; gap: 6px; scroll-margin-top: 90px; }
.chk-group h3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 6px; }
.chk-tag { display: inline-block; font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chk-tag.bad { color: var(--bad); } .chk-tag.warn { color: var(--warn); }
.chk-ok { color: var(--good); font-weight: 700; }
tr.chk-done th { color: var(--muted); font-weight: 400; }
.chk-banner { appearance: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 10px; padding: 10px 14px; }
.chk-banner span:nth-child(2) { flex: 1; font-size: .88rem; }
.sn-badge { margin-left: auto; background: var(--bad); color: var(--surface); font-size: .7rem; font-weight: 700; border-radius: 999px; padding: 0 7px; line-height: 1.6; }
@media (max-width: 560px) { .chk-hero { padding: 16px; gap: 14px; } .chk-ring { width: 84px; height: 84px; } .chk-ring span { width: 64px; height: 64px; font-size: 1.3rem; } }
.cal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.cal-month { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 6px; align-content: start; }
.cal-month.now { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-head { font-weight: 700; display: flex; gap: 8px; align-items: center; }
.cal-item { display: grid; grid-template-columns: auto auto 1fr; gap: 6px; align-items: start; font-size: .8rem; cursor: pointer; }
.cal-item.done span:last-child { color: var(--muted); text-decoration: line-through; }
.cal-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: .45em; }
select.act-st.done { color: var(--good); font-weight: 700; } select.act-st.late { color: var(--bad); font-weight: 700; }
.pres-scope { max-height: 900px; overflow-y: auto; }
.tab-group { align-self: center; font-size: .7rem; letter-spacing: .1em; color: var(--accent); font-weight: 700; padding: 0 6px 0 10px; border-left: 1px solid var(--line); }
.tab-group:first-child { border-left: 0; padding-left: 0; }
.an-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 20px; align-items: start; }
.subnav { display: grid; gap: 2px; position: sticky; top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; }

  const x = i => labels.length === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (labels.length - 1);
  const y = v => T + (H - T - B) * (top - v) / (top - bottom || 1);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="推移グラフ">`;
  for (let v = bottom; v <= top + 1e-9; v += step) s += `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" ${Math.abs(v) < 1e-9 && bottom < 0 ? 'style="stroke:var(--muted)"' : ''}/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${man(v)}</text>`;
  if (target) s += `<line x1="${L}" x2="${W - R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W - R}" y="${y(target) - 6}" text-anchor="end" style="fill:var(--bad)">${targetLabel} ${man(target)}</text>`;
  series.forEach(se => {
    const pts = se.values.map((v, i) => v == null ? null : [x(i), y(v)]);
    const segs = []; let cur = [];
    pts.forEach(p => { if (p) cur.push(p); else if (cur.length) { segs.push(cur); cur = []; } });
    if (cur.length) segs.push(cur);
    segs.forEach(sg => { s += `<polyline points="${sg.map(p => p.join(',')).join(' ')}" fill="none" stroke="${se.color}" stroke-width="${se.width || 2}" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''}/>`; });
    pts.forEach((p, i) => { if (p && (se.dots !== false || i === pts.length - 1)) s += `<circle cx="${p[0]}" cy="${p[1]}" r="${se.r || 3.5}" fill="${se.color}"/>`; });
  });
  labels.forEach((lab, i) => { s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${lab}</text>`; });
  return s + '</svg>';
}

const defaultCf = () => ({
  collectLag: 2, payLag: 2, annualRepay: 3000, newBorrow: 0, newBorrowMonth: 6, minCash: 6000,
  patterns: [
    { key: 'low', label: '慎重案', salesPct: 92, grossDelta: -1, fixedPct: 100 },

const openingBs = fy => fy === n0(state.company.currentFY) ? state.bs.actual : (state.bs.targets[fy - 1] || state.bs.actual);
const fyBs = fy => state.bs.targets[fy] || state.bs.actual;
const prevTax = fy => prevTaxes(fy).incomeTotal;
// months: [{sales, gp, op}] ×12 → 月末現預金
function cashSim(fy, months, actualCash = [], opts = {}) {
  const cf = state.cf, ob = openingBs(fy), b = fyBs(fy);
  const lagR = Math.max(0, Math.round(n0(cf.collectLag))), lagP = Math.max(0, Math.round(n0(cf.payLag)));
  const depM = n0(b.dep) / 12, intM = n0(b.interest) / 12, pt = prevTaxes(fy), tax = pt.incomeTotal, ctPlan = ctSchedule(pt.ct);
  const tot = k => months.reduce((s, m) => s + n0(m[k]), 0);
  const ctIn = taxEstimate(0, tot('sales'), tot('op'), b.dep).ct / 12;
  const pm = opts.prevMonths;
  let cash = opts.cash != null ? n0(opts.cash) : n0(ob.cash);
  const rows = months.map((mo, i) => {
    const receipts = i >= lagR ? n0(months[i - lagR].sales) : pm ? n0(pm[12 + i - lagR]?.sales) : n0(ob.receivables) / (lagR || 1);
    const cogs = i >= lagP ? n0(months[i - lagP].sales) - n0(months[i - lagP].gp) : pm ? n0(pm[12 + i - lagP]?.sales) - n0(pm[12 + i - lagP]?.gp) : n0(ob.payables) / (lagP || 1);
    const opex = n0(mo.gp) - n0(mo.op) - depM;
    const taxPay = i === 1 || i === 7 ? tax / 2 : 0;
    const lm = hasLoans() ? loanMonth(opts.ymOf ? opts.ymOf(i) : fyMonths(fy)[i].ym) : null;
    const repay = lm ? lm.p : n0(cf.annualRepay) / 12;
    const borrow = i === n0(cf.newBorrowMonth) - 1 ? n0(cf.newBorrow) : 0;
    const ctPay = n0(ctPlan[i]);
    const intPay = lm ? lm.i : intM;
    const net = receipts - cogs - opex - intPay - taxPay - repay + borrow + ctIn - ctPay;
    const actual = actualCash[i] != null && actualCash[i] !== '';
    cash = actual ? n0(actualCash[i]) : cash + net;
    return { receipts, cogs, opex, interest: intPay, tax: taxPay, repay, borrow, ctIn, ctPay, net, end: cash, actual };
  });
  const minRow = rows.reduce((a, r, i) => r.end < a.v ? { v: r.end, i } : a, { v: Infinity, i: -1 });
  return { rows, end: cash, min: minRow.v, minIdx: minRow.i, under: rows.filter(r => r.end < n0(cf.minCash)).length };
}
function seasonWeights(fy) {
  const rows = state.monthly[fy] || [];
  const sum = rows.reduce((s, r) => s + n0(r.sb), 0);
  if (sum > 0 && rows.length === 12) return rows.map(r => n0(r.sb) / sum);
  const prev = state.monthly[fy - 1] || [];
  const ps = prev.reduce((s, r) => s + n0(r.sa), 0);
  if (ps > 0 && prev.length === 12) return prev.map(r => n0(r.sa) / ps);
  return Array(12).fill(1 / 12);
}
function patternBudget(fy, pt) {
  const p = planFor(fy); if (!p) return null;
  const S = n0(p.sales) * n0(pt.salesPct) / 100, gr = (n0(p.grossRate) + n0(pt.grossDelta)) / 100;
  const fixed = (n0(p.sga) + n0(p.execComp)) * n0(pt.fixedPct) / 100;
  const months = seasonWeights(fy).map(w => { const sales = Math.round(S * w), gp = Math.round(sales * gr); return { sales, gp, op: Math.round(gp - fixed / 12) }; });
  const tot = k => months.reduce((s, m) => s + m[k], 0);
  const op = tot('op'), ordinary = op - n0(fyBs(fy).interest);
  return { pt, months, sales: tot('sales'), gp: tot('gp'), op, ordinary, gr: gr * 100, fixed, sim: cashSim(fy, months) };
}

// ---------- 予実差異と着地予測 ----------
function variance(r) {
  if (r.sa == null || r.sa === '') return null;
  const sb = n0(r.sb), sa = n0(r.sa), gb = n0(r.gb), ga = n0(r.ga), ob = n0(r.ob), oa = n0(r.oa);
  const br = sb ? gb / sb : 0;
  return { vol: (sa - sb) * br, mix: ga - sa * br, fix: (gb - ob) - (ga - oa), total: oa - ob };
}
function landing(fy) {
  const rows = monthlyRows(fy), y = ytd(fy);
  const k = y.n && y.sb ? y.sa / y.sb : 1;
  const gr = y.sa ? y.ga / y.sa : null;
  const fixA = y.n ? (y.ga - y.oa) / y.n : null;
  const has = r => r.sa != null && r.sa !== '';
  const make = trend => rows.map(r => {
    if (has(r)) return { sales: n0(r.sa), gp: n0(r.ga), op: n0(r.oa) };
    if (!trend) return { sales: n0(r.sb), gp: n0(r.gb), op: n0(r.ob) };
    const sales = n0(r.sb) * k, gp = sales * (gr ?? (n0(r.sb) ? n0(r.gb) / n0(r.sb) : 0));
    return { sales, gp, op: gp - (fixA ?? (n0(r.gb) - n0(r.ob))) };
  });
  const cash = rows.map(r => r.cash);
  return [['budget', '予算どおり進んだ場合', make(false)], ['trend', '今のペースが続いた場合', make(true)]].map(([key, label, months]) => {
    const tot = kk => months.reduce((s, m) => s + m[kk], 0);
    return { key, label, months, sales: tot('sales'), gp: tot('gp'), op: tot('op'), sim: cashSim(fy, months, cash) };
  });
}

async function initCloud() {

function taxEstimate(ordinary, sales, op, dep) {
  const t = state.tax || defaultTaxCfg();
  const I = Math.max(0, n0(ordinary) + n0(t.adjust));
  const corp = Math.min(I, 800) * 0.15 + Math.max(I - 800, 0) * 0.232;
  const localCorp = corp * 0.103;
  const inhabitant = corp * 0.07 + n0(t.kintowari);
  const biz = Math.min(I, 400) * 0.035 + Math.max(Math.min(I, 800) - 400, 0) * 0.053 + Math.max(I - 800, 0) * 0.07;
  const special = biz * 0.37;
  const ct = Math.max(0, (n0(sales) - Math.max(0, n0(sales) - n0(op) - n0(dep)) * n0(t.purchaseRatio) / 100) * 0.1);
  const incomeTotal = corp + localCorp + inhabitant + biz + special;
  return { I, corp, localCorp, inhabitant, biz, special, incomeTotal, ct, effective: I ? incomeTotal / I * 100 : NaN };
}

  const te = taxEstimate(L.op - n0(fyBs(fy).interest), L.sales, L.op, fyBs(fy).dep);

function timeSeries() {

async function saveHtmlFile(filename, doc) {
  let dl = null;
  try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) {}

    try { await dl.save({ filename, data: doc }); toast('保存しました。ブラウザで開いて印刷・PDF化できます'); }

    return;
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([doc], { type: filename.endsWith('.csv') ? 'text/csv' : 'text/html' })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); toast('保存しました'); }

}

// ---------- 借入金・返済予定（銀行別・融資別） ----------
const LOAN_KINDS = ['証書貸付', '手形貸付', '当座貸越', '私募債', 'リース・割賦'];
const LOAN_METHODS = ['元金均等', '元利均等', '期日一括'];
const ymAdd = (ym, k) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
const ymDiff = (a, b) => { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); };
const loanCache = { key: '', map: null };
// 融資ごとの月別返済（基準月の月末残高から、最長15年先まで）
function loanSchedules() {
  const loans = state.loans || [];
  const key = JSON.stringify(loans);
  if (loanCache.key === key) return loanCache.map;
  const out = loans.map(ln => {
    const rows = {}; if (!ln.asOf || !ln.maturity) return { ln, rows };
    let bal = n0(ln.balance), ym = ln.asOf;
    const r = n0(ln.rate) / 100 / 12, firstPay = ln.graceUntil && ln.graceUntil > ln.asOf ? ymAdd(ln.graceUntil, 1) : ymAdd(ln.asOf, 1);
    const nPay = Math.max(1, ymDiff(firstPay, ln.maturity) + 1);
    const fixedP = n0(ln.monthlyPrincipal) || bal / nPay;
    const pmt = r > 0 ? bal * r / (1 - Math.pow(1 + r, -nPay)) : bal / nPay;
    const balloon = ln.method === '期日一括' || ln.kind === '当座貸越';
    for (let k = 1; k <= 180 && bal > 0.01; k++) {
      ym = ymAdd(ln.asOf, k);
      const interest = bal * r;
      let p = 0;
      if (ln.rollover && ym >= ln.maturity) { rows[ym] = { p: ym === ln.maturity ? bal : 0, i: interest, bal, rolled: ym === ln.maturity }; continue; }
      if (ym > ln.maturity) break;
      if (ym === ln.maturity) p = bal;
      else if (!balloon && ym >= firstPay) p = ln.method === '元利均等' ? Math.min(bal, pmt - interest) : Math.min(bal, fixedP);
      bal -= p;
      rows[ym] = { p, i: interest, bal, rolled: false };
    }
    return { ln, rows };
  });
  loanCache.key = key; loanCache.map = out;
  return out;
}
// 月の返済元金・利息の合計（折り返し予定の期日一括はキャッシュアウトにしない）
function loanMonth(ym) {
  let p = 0, i = 0, bal = 0;
  loanSchedules().forEach(({ ln, rows }) => {
    const r = rows[ym];
    if (r) { p += r.rolled ? 0 : r.p; i += r.i; bal += r.bal; }
    else if (ln.asOf && ym <= ln.asOf) bal += n0(ln.balance);
  });
  return { p, i, bal };
}
const hasLoans = () => (state.loans || []).length > 0;
const curYm = () => { const fy = n0(state.company.currentFY), rows = monthlyRows(fy), fm = fyMonths(fy); let k = -1; rows.forEach((r, i) => { if (r.sa != null && r.sa !== '') k = i; }); return k >= 0 ? fm[k].ym : ymAdd(fm[0].ym, -1); };
const next12Repay = () => Array.from({ length: 12 }, (_, k) => loanMonth(ymAdd(curYm(), k + 1)).p).reduce((a, b) => a + b, 0);

function viewLoans() {
  state.loans ??= [];
  const loans = state.loans, base = curYm();
  const months = Array.from({ length: ui.loanSpan || 12 }, (_, k) => ymAdd(base, k + 1));
  const sch = loanSchedules();
  const banks = [...new Set(loans.map(l => l.bank || '（銀行名未入力）'))];
  const balNow = l => { const r = sch.find(x => x.ln === l)?.rows[base]; return base <= l.asOf ? n0(l.balance) : r ? r.bal : 0; };
  const sumBal = loans.reduce((s, l) => s + balNow(l), 0);
  const rep12 = next12Repay(), int12 = months.slice(0, 12).reduce((s, ym) => s + loanMonth(ym).i, 0);
  const wRate = sumBal ? loans.reduce((s, l) => s + balNow(l) * n0(l.rate), 0) / sumBal : NaN;
  const fy = n0(state.company.currentFY), L = landing(fy)[1], te = taxEstimate(L.op - int12, L.sales, L.op, fyBs(fy).dep);
  const cfFund = L.op - int12 - te.incomeTotal + n0(fyBs(fy).dep);
  const cover = rep12 ? cfFund / rep12 : Infinity;
  const bankRows = banks.map(b => {
    const ls = loans.filter(l => (l.bank || '（銀行名未入力）') === b), bal = ls.reduce((s, l) => s + balNow(l), 0);
    const rp = months.slice(0, 12).reduce((s, ym) => s + ls.reduce((a, l) => { const r = sch.find(x => x.ln === l)?.rows[ym]; return a + (r && !r.rolled ? r.p : 0); }, 0), 0);
    return { b, n: ls.length, bal, rp, rate: bal ? ls.reduce((s, l) => s + balNow(l) * n0(l.rate), 0) / bal : NaN, guar: [...new Set(ls.map(l => l.guarantee).filter(Boolean))].join('・') };
  }).sort((a, b) => b.bal - a.bal);
  const maxBal = Math.max(1, ...bankRows.map(x => x.bal));
  const yearsAhead = Array.from({ length: 8 }, (_, k) => fy + k);
  const fyRepay = yr => fyMonths(yr).reduce((s, m) => s + loanMonth(m.ym).p, 0);
  const fyEndBal = yr => loanMonth(fyMonths(yr)[11].ym).bal;
  const view = ui.loanView || 'bank';
  const groups = view === 'bank' ? banks.map(b => ({ label: b, ls: loans.filter(l => (l.bank || '（銀行名未入力）') === b) })) : loans.map(l => ({ label: `${l.bank || ''} ${l.name || ''}`, ls: [l] }));
  const cell = (ls, ym, k) => ls.reduce((a, l) => { const r = sch.find(x => x.ln === l)?.rows[ym]; return a + (r ? (k === 'p' ? (r.rolled ? 0 : r.p) : r.i) : 0); }, 0);
  const soon = loans.filter(l => l.maturity && ymDiff(base, l.maturity) >= 0 && ymDiff(base, l.maturity) <= 3 && (l.method === '期日一括' || l.kind === '手形貸付' || l.kind === '当座貸越'));
  const inp = (l, j, k, type, extra = '') => `<input id="ln-${l.id}-${k}" ${type ? `type="${type}"` : ''} ${type === 'number' ? 'data-num' : ''} data-bind="loans.${j}.${k}" value="${esc(l[k] ?? '')}" ${extra}>`;
  const sel = (l, j, k, opts) => `<select id="ln-${l.id}-${k}" data-bind="loans.${j}.${k}">${opts.map(o => `<option ${l[k] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  return `
  <section class="kpis">
    <div class="kpi"><span class="label">借入残高（${ymLabel(base)}末）</span><span class="value">${manU(sumBal)}</span><span class="sub">${banks.length}行・${loans.length}本</span></div>
    <div class="kpi"><span class="label">今後12か月の返済元金</span><span class="value">${manU(rep12)}</span><span class="sub">支払利息 ${manU(int12)}・加重平均金利 ${isFinite(wRate) ? wRate.toFixed(2) + '%' : '—'}</span></div>
    <div class="kpi ${cover >= 1.2 ? 'good' : cover >= 1 ? 'warn' : 'bad'}"><span class="label">返済余力（返済原資 ÷ 年間返済）</span><span class="value">${isFinite(cover) ? cover.toFixed(2) + '倍' : '—'}</span><span class="sub">返済原資（税引後利益＋減価償却費）${manU(cfFund)}</span></div>
    <div class="kpi"><span class="label">${fy + 4}年度末の残高見込み</span><span class="value">${manU(fyEndBal(fy + 4))}</span><span class="sub">新規借入がない場合</span></div>
  </section>
  ${soon.length ? `<p class="hint" style="color:var(--warn)">3か月以内に期日を迎える融資：${soon.map(l => `${esc(l.bank)} ${esc(l.name)}（${ymLabel(l.maturity)}・${manU(balNow(l))}${l.rollover ? '・折り返し予定' : '・一括返済'}）`).join('、')}。条件の確認と書類の準備を始めましょう。</p>` : ''}

  <section class="grid-2">
    <div class="panel"><div class="panel-head"><h2>銀行別の借入</h2><span class="muted small">残高の大きい順</span></div>
      ${bankRows.length ? bankRows.map(x => `<div style="display:grid;gap:4px">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><strong>${esc(x.b)}</strong><span class="num small">${manU(x.bal)}（${sumBal ? pct(x.bal / sumBal * 100) : '—'}）</span></div>
        <div class="meter"><span style="width:${x.bal / maxBal * 100}%;background:var(--c1)"></span></div>
        <span class="small muted">${x.n}本・平均金利 ${isFinite(x.rate) ? x.rate.toFixed(2) + '%' : '—'}・今後12か月の返済 ${manU(x.rp)}${x.guar ? `・${esc(x.guar)}` : ''}</span></div>`).join('') : '<div class="empty">下の「融資を追加」から入力してください。</div>'}
    </div>
    <div class="panel"><div class="panel-head"><h2>借入残高の推移</h2><span class="muted small">年度末の残高と年間返済額</span></div>
      ${loans.length ? dashLineChart(yearsAhead.map(String), [{ name: '年度末の借入残高', values: yearsAhead.map(fyEndBal), color: 'var(--c1)', area: true, endLabel: true }], { label: '借入残高の推移', tipTitle: i => `${yearsAhead[i]}年度末` }) : ''}
      <div class="table-scroll"><table><thead><tr><th></th>${yearsAhead.map(yr => `<th class="num">${yr}</th>`).join('')}</tr></thead><tbody>
        <tr><th>年間返済元金</th>${yearsAhead.map(yr => `<td class="num">${man(fyRepay(yr))}</td>`).join('')}</tr>
        <tr><th>年度末残高</th>${yearsAhead.map(yr => `<td class="num">${man(fyEndBal(yr))}</td>`).join('')}</tr></tbody></table></div>
    </div>
  </section>

  <section class="panel"><div class="panel-head"><h2>融資の一覧</h2><div class="btn-row"><button class="btn" data-action="loan-add">＋ 融資を追加</button>${loans.length ? `<button class="btn ${ui.armed === 'loan-bs' ? 'armed danger' : ''}" data-action="loan-bs">${ui.armed === 'loan-bs' ? 'BSの借入金を上書きします。もう一度' : '残高をBS（直近決算）に反映'}</button>` : ''}</div></div>
    <div class="table-scroll"><table><thead><tr><th>銀行</th><th>融資名・資金使途</th><th>種類</th><th class="num">残高（万円）</th><th>残高の基準月</th><th class="num">金利（%）</th><th>返済方法</th><th class="num">毎月の元金</th><th>据置の終了月</th><th>最終返済月</th><th>保証</th><th>担保</th><th>期日に折り返し</th><th></th></tr></thead><tbody>
      ${loans.map((l, j) => `<tr>
        <td>${inp(l, j, 'bank', '', 'style="min-width:120px" list="bank-list"')}</td><td>${inp(l, j, 'name', '', 'style="min-width:150px"')}</td><td>${sel(l, j, 'kind', LOAN_KINDS)}</td>
        <td>${inp(l, j, 'balance', 'number')}</td><td>${inp(l, j, 'asOf', 'month')}</td><td>${inp(l, j, 'rate', 'number', 'step="0.01" style="min-width:70px"')}</td>
        <td>${sel(l, j, 'method', LOAN_METHODS)}</td><td>${inp(l, j, 'monthlyPrincipal', 'number', `placeholder="${(() => { const s = sch.find(x => x.ln === l); const r = s && Object.values(s.rows).find(v => v.p > 0 && !v.rolled); return r ? '自動 ' + man(r.p) : '自動'; })()}"`)}</td>
        <td>${inp(l, j, 'graceUntil', 'month')}</td><td>${inp(l, j, 'maturity', 'month')}</td>
        <td>${sel(l, j, 'guarantee', ['', '信用保証協会', '経営者保証', '保証協会＋経営者保証', '保証なし'])}</td><td>${inp(l, j, 'collateral', '', 'style="min-width:90px"')}</td>
        <td style="text-align:center"><input type="checkbox" id="ln-${l.id}-ro" data-bool data-bind="loans.${j}.rollover" ${l.rollover ? 'checked' : ''} aria-label="期日に折り返し"></td>
        <td><button class="btn ghost" data-action="loan-del" data-j="${j}">削除</button></td></tr>`).join('') || '<tr><td colspan="14" class="muted">融資がまだありません。銀行の返済予定表や残高証明を見ながら入力してください。</td></tr>'}
    </tbody></table></div>
    <datalist id="bank-list">${banks.map(b => `<option value="${esc(b)}">`).join('')}</datalist>

// ⑤ 経審シミュレーション（経営状況分析 Y点の試算と総合評定値 P点）
const KY = [
  ['x1', '純支払利息比率', '%', -0.4650, -0.3, 5.1, false], ['x2', '負債回転期間', 'か月', -0.0508, 0.9, 18.0, false],
  ['x3', '総資本売上総利益率', '%', 0.0264, 6.5, 63.6, true], ['x4', '売上高経常利益率', '%', 0.0277, -8.5, 5.1, true],
  ['x5', '自己資本対固定資産比率', '%', 0.0011, -76.5, 350.0, true], ['x6', '自己資本比率', '%', 0.0089, -68.6, 68.5, true],
  ['x7', '営業キャッシュフロー', '億円', 0.0818, -10.0, 15.0, true], ['x8', '利益剰余金', '億円', 0.0172, -3.0, 100.0, true],
];
function keishinY(src) {
  const k = state.keishin || {};
  const assetsAvg = src.prevAssets ? (src.assets + src.prevAssets) / 2 : src.assets;
  const raw = {
    x1: src.sales ? (n0(src.interest) - n0(k.recvInt)) / src.sales * 100 : 0,
    x2: src.sales ? src.liab / (src.sales / 12) : 0,
    x3: assetsAvg ? src.gp / assetsAvg * 100 : 0,
    x4: src.sales ? src.ordinary / src.sales * 100 : 0,
    x5: src.fixed ? src.equity / src.fixed * 100 : 0,
    x6: src.assets ? src.equity / src.assets * 100 : 0,
    x7: src.opcf / 10000,
    x8: (src.equity - n0(k.capital)) / 10000,
  };
  const items = KY.map(([key, label, unit, coef, lo, hi, up]) => { const v = Math.max(lo, Math.min(hi, raw[key])); return { key, label, unit, coef, lo, hi, up, raw: raw[key], v, pts: coef * v * 167.3 }; });
  const A = Math.round((items.reduce((s, x) => s + x.coef * x.v, 0) + 0.1906) * 100) / 100;
  return { items, A, Y: Math.max(0, Math.min(1595, Math.round(167.3 * A + 583))) };
}
function keishinSources() {
  const fy = n0(state.company.currentFY), a = state.bs.actual, h = state.history || {}, out = [];
  const mk = (label, b, sales, gp, op, prevAssets) => {
    const f = fin({ data: b, sales, op }), ord = op - n0(b.interest), te = taxEstimate(ord, sales, op, b.dep);
    return { label, sales, gp, ordinary: ord, interest: n0(b.interest), liab: f.liab, assets: f.assets, equity: f.equity, fixed: n0(b.fixed), opcf: ord - te.incomeTotal + n0(b.dep), prevAssets };
  };
  const gpA = n0(h[fy - 1]?.gp) || n0(a.sales) * n0(planFor(fy)?.grossRate || 25) / 100;
  out.push(mk(a.label || '直近決算', a, n0(a.sales), gpA, n0(a.op), n0(h[fy - 2]?.assets) || null));
  let prevAssets = fin({ data: a, sales: n0(a.sales), op: n0(a.op) }).assets;
  [...state.plans].sort((x, y) => n0(x.year) - n0(y.year)).forEach(p => { const t = state.bs.targets[p.year]; if (!t) return; const pc = planCalc(p); const s = mk(`${p.year}年度 計画`, t, n0(p.sales), pc.gp, pc.op, prevAssets); prevAssets = s.assets; out.push(s); });
  return out;
}

  </section>
  <section class="panel"><div class="panel-head"><h2>Y点の推移（経営計画どおりに進んだ場合）</h2></div>
    ${dashLineChart(srcs.map(s => s.label.replace(' 計画', '').replace(' 実績', '')), [{ name: 'Y点', values: ys.map(y => y.Y), color: 'var(--c1)', endLabel: true }], { label: 'Y点の推移' })}
    <div class="table-scroll"><table><thead><tr><th>指標</th>${srcs.map(s => `<th class="num">${esc(s.label)}</th>`).join('')}<th class="num">評点への影響（現在）</th></tr></thead><tbody>

      <p class="small muted">純支払利息比率と営業キャッシュフローは、Y点への影響が特に大きい項目です。借入の圧縮・金利交渉・利益の確保がそのまま評点に効きます。</p></div>

  let s = `<svg class="chart dash-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || '')}">`;
  for (let v = bottom; v <= top + 1e-9; v += step) s += `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtK(v)}</text>`;
  if (opts.ref) s += `<line x1="${L}" x2="${W - R}" y1="${y(opts.ref.value)}" y2="${y(opts.ref.value)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W - R}" y="${y(opts.ref.value) - 6}" text-anchor="end" style="fill:var(--ink)">${esc(opts.ref.label)} ${man(opts.ref.value)}</text>`;
  if (opts.now != null) s += `<line x1="${x(opts.now) + bw / 2}" x2="${x(opts.now) + bw / 2}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-width="1"/><text x="${x(opts.now) + bw / 2 + 4}" y="${T + 10}" style="font-size:10px">ここから予測</text>`;
  series.forEach(se => {
    if (se.area) { const pts = se.values.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean); if (pts.length > 1) s += `<polygon points="${pts.map(p => p.join(',')).join(' ')} ${pts[pts.length - 1][0]},${y(Math.max(0, bottom))} ${pts[0][0]},${y(Math.max(0, bottom))}" fill="${se.color}" fill-opacity=".1"/>`; }
    const segs = []; let cur = [];
    se.values.forEach((v, i) => { if (v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push([x(i), y(v)]); });
    if (cur.length) segs.push(cur);
    segs.forEach(sg => { s += `<polyline points="${sg.map(p => p.join(',')).join(' ')}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''}/>`; });
    const li = se.values.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
    if (li != null && se.endDot !== false) s += `<circle cx="${x(li)}" cy="${y(se.values[li])}" r="4.5" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`;
    if (li != null && se.endLabel) s += `<text x="${Math.min(x(li) + 8, W - R - 4)}" y="${y(se.values[li]) - 9}" text-anchor="${x(li) > W - 90 ? 'end' : 'start'}" style="fill:var(--ink);font-weight:700">${man(se.values[li])}</text>`;
  });
  labels.forEach((lab, i) => { s += `<text x="${x(i)}" y="${H - 9}" text-anchor="middle">${lab}</text>`; });
  s += `<line class="xhair" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" opacity="0"/>`;
  labels.forEach((lab, i) => {
    const rows = series.filter(se => se.values[i] != null).map(se => [se.name, manU(se.values[i]), se.color]);
    if (rows.length) s += `<rect class="hit" x="${L + bw * i}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent" data-x="${x(i)}" data-tip="${tipAttr(opts.tipTitle ? opts.tipTitle(i) : lab, rows)}"/>`;
  });
  return s + '</svg>';
}
// 縦棒の比較（データ側だけ角丸・幅24px以下・2pxの隙間）
function dashBarChart(labels, series) {
  const W = 640, H = 230, L = 56, R = 12, T = 24, B = 30;
  const max = Math.max(1, ...series.flatMap(s => s.values.map(n0)));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - n0(v) / top), base = y(0);
  const band = (W - L - R) / labels.length, bwid = Math.min(24, (band * 0.7 - 2 * (series.length - 1)) / series.length);
  const grp = bwid * series.length + 2 * (series.length - 1);
  const bar = (x, v, color) => { const h = Math.max(0, base - y(v)), r = Math.min(4, h); return h <= 0 ? '' : `<path d="M${x},${base} V${base - h + r} Q${x},${base - h} ${x + r},${base - h} H${x + bwid - r} Q${x + bwid},${base - h} ${x + bwid},${base - h + r} V${base} Z" fill="${color}"/>`; };
  let s = `<svg class="chart dash-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="必要な役員報酬と計画">`;
  for (let v = 0; v <= top + 1e-9; v += step) s += `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${man(v)}</text>`;
  labels.forEach((lab, i) => {
    const x0 = L + band * i + (band - grp) / 2;
    series.forEach((se, k) => { s += bar(x0 + k * (bwid + 2), se.values[i], se.color); });
    s += `<text x="${L + band * (i + 0.5)}" y="${H - 9}" text-anchor="middle">${lab}</text>`;
    const gap = n0(series[1].values[i]) - n0(series[0].values[i]);
    s += `<text x="${L + band * (i + 0.5)}" y="${Math.min(y(series[0].values[i]), y(series[1].values[i])) - 7}" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:700">${gap >= 0 ? '+' : ''}${man(gap)}</text>`;
    s += `<rect class="hit" x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}" fill="transparent" data-tip="${tipAttr(lab + '年度', [...series.map(se => [se.name, manU(se.values[i]), se.color]), ['過不足', (gap >= 0 ? '+' : '') + manU(gap), '']])}"/>`;
  });
  return s + '</svg>';
}
const legendItem = (color, label, kind = 'line', dash) => `<span><i class="lg-${kind}" style="${kind === 'line' ? `border-top:2px ${dash ? 'dashed' : 'solid'} ${color}` : `background:${color}`}"></i>${label}</span>`;
function statusTile(tab, tone, title, value, sub, extra) {
  const icon = { good: '✓', warn: '!', bad: '×' }[tone] || '·', word = { good: '良好', warn: '注意', bad: '要対応' }[tone] || '—';
  return `<button class="status-tile ${tone}" data-action="tab" data-tab="${tab}"><span class="st-head"><span class="st-icon" aria-hidden="true">${icon}</span><span class="st-title">${title}</span><span class="st-word">${word}</span></span><span class="st-value">${value}</span><span class="st-sub">${sub}</span>${extra || ''}</button>`;
}

// ツールチップ（グラフにマウスを乗せると数値を表示）
(() => {
  const tip = document.createElement('div'); tip.className = 'chart-tip'; tip.hidden = true; document.body.appendChild(tip);
  const hide = () => { tip.hidden = true; document.querySelectorAll('.xhair').forEach(l => l.setAttribute('opacity', '0')); document.querySelectorAll('.hit.on').forEach(h => h.classList.remove('on')); };
  document.addEventListener('pointermove', e => {
    const h = e.target.closest?.('.hit[data-tip]');
    if (!h) { if (!tip.hidden) hide(); return; }
    const [title, ...rows] = h.dataset.tip.split('\u001e');
    tip.replaceChildren();
    const t = document.createElement('div'); t.className = 'ct-title'; t.textContent = title; tip.appendChild(t);
    rows.forEach(r => { const [k, v, c] = r.split('\u001f'); const row = document.createElement('div'); row.className = 'ct-row'; const key = document.createElement('i'); if (c) key.style.borderTopColor = c; else key.style.visibility = 'hidden'; const val = document.createElement('strong'); val.textContent = v; const lab = document.createElement('span'); lab.textContent = k; row.append(key, val, lab); tip.appendChild(row); });
    tip.hidden = false;
    const pad = 14, tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - tw - 8, e.clientX + pad) + 'px';
    tip.style.top = Math.max(8, e.clientY - th - pad) + 'px';
    const svg = h.closest('svg'), xh = svg?.querySelector('.xhair');
    if (xh && h.dataset.x) { xh.setAttribute('x1', h.dataset.x); xh.setAttribute('x2', h.dataset.x); xh.setAttribute('opacity', '1'); }
    if (!h.dataset.x) { document.querySelectorAll('.hit.on').forEach(o => o.classList.remove('on')); h.classList.add('on'); }
  });
  document.addEventListener('pointerleave', hide);
  window.addEventListener('scroll', hide, { passive: true });
})();

  <section class="panel">

      <thead><tr><th>年</th>${years.map(y => `<th class="num">${y}</th>`).join('')}</tr></thead>

        <tr><th>必要手取り</th>${years.map(y => `<td class="num">${man(needTakeHome(m, y))}</td>`).join('')}</tr>
        <tr class="link"><th>必要な役員報酬</th>${years.map(y => `<td class="num"><strong>${man(reqComp(m, y))}</strong></td>`).join('')}</tr>

  </section>`;
}

function viewMonthly() {
  const { fys, fy } = pickFy();
  const rows = monthlyRows(fy);
  const months = fyMonths(fy);
  const p = planFor(fy);
  const y = ytd(fy);
  const tot = k => rows.reduce((s, r) => s + n0(r[k]), 0);
  const cell = (i, k) => `<td><input id="mo-${fy}-${i}-${k}" type="number" data-num data-bind="monthly.${fy}.${i}.${k}" value="${rows[i][k] ?? ''}" ${k.endsWith('a') ? 'placeholder="実績"' : ''}></td>`;
  const rate = (a, b) => (a == null || a === '' || !n0(b)) ? '<td class="num muted">—</td>' : `<td class="num ${n0(a) >= n0(b) ? 'pos' : 'neg'}">${pct(n0(a) / n0(b) * 100)}</td>`;
  return `
  <section class="panel">
    <div class="panel-head"><h2>月次予実</h2>
      <div class="btn-row">
        <label class="field" style="grid-auto-flow:column;align-items:center">年度
          <select id="mo-fy" data-ui="fy">${fys.map(f => `<option value="${f}" ${f === fy ? 'selected' : ''}>${f}年度</option>`).join('')}</select></label>
        <button class="btn ${ui.armed === 'spread' ? 'armed danger' : ''}" data-action="spread" ${p ? '' : 'disabled'}>${ui.armed === 'spread' ? '上書きしてよければもう一度' : '年間計画から予算を均等按分'}</button>
      </div></div>
    <div class="kpis">
      <div class="kpi ${tone(y.sRate)}"><span class="label">売上 累計達成率</span><span class="value">${y.n ? pct(y.sRate) : '—'}</span><span class="sub">${y.n}か月 実績 ${manU(y.sa)}</span></div>
      <div class="kpi ${tone(y.gRate)}"><span class="label">粗利 累計達成率</span><span class="value">${y.n ? pct(y.gRate) : '—'}</span><span class="sub">粗利率 ${y.sa ? pct(y.ga / y.sa * 100) : '—'}</span></div>
      <div class="kpi ${y.n ? (y.oa >= y.ob ? 'good' : 'bad') : ''}"><span class="label">営業利益 累計</span><span class="value">${y.n ? manU(y.oa) : '—'}</span><span class="sub">予算 ${manU(y.ob)}</span></div>
      <div class="kpi"><span class="label">年間予算 合計</span><span class="value">${manU(tot('sb'))}</span><span class="sub">計画 ${p ? manU(p.sales) : '—'}</span></div>
    </div>
    ${barChartSvg(months.map(m => m.m + '月'), rows.map(r => r.sb), rows.map(r => r.sa))}
    <div class="table-scroll"><table>
      <thead><tr><th rowspan="2">月</th><th colspan="3" style="text-align:center">売上</th><th colspan="3" style="text-align:center">粗利</th><th colspan="3" style="text-align:center">営業利益</th><th rowspan="2">月末現預金<br>（実績）</th></tr>
      <tr><th>予算</th><th>実績</th><th class="num">達成率</th><th>予算</th><th>実績</th><th class="num">達成率</th><th>予算</th><th>実績</th><th class="num">差異</th></tr></thead>
      <tbody>
      ${months.map((mo, i) => { const r = rows[i]; return `<tr>
        <th>${mo.m}月</th>${cell(i, 'sb')}${cell(i, 'sa')}${rate(r.sa, r.sb)}${cell(i, 'gb')}${cell(i, 'ga')}${rate(r.ga, r.gb)}${cell(i, 'ob')}${cell(i, 'oa')}
        ${r.oa == null || r.oa === '' ? '<td class="num muted">—</td>' : `<td class="num ${n0(r.oa) >= n0(r.ob) ? 'pos' : 'neg'}">${n0(r.oa) - n0(r.ob) >= 0 ? '+' : ''}${man(n0(r.oa) - n0(r.ob))}</td>`}${cell(i, 'cash')}
      </tr>`; }).join('')}
      <tr class="total"><td>年計</td><td class="num">${man(tot('sb'))}</td><td class="num">${man(tot('sa'))}</td><td></td><td class="num">${man(tot('gb'))}</td><td class="num">${man(tot('ga'))}</td><td></td><td class="num">${man(tot('ob'))}</td><td class="num">${man(tot('oa'))}</td><td></td><td></td></tr>
      </tbody></table></div>
    <p class="small muted">単位：万円。実績が入った月だけで累計達成率を計算します。試算表の数字と月末の現預金残高を毎月入れてください。</p>
  </section>
  ${varianceAndLanding(fy)}`;
}

function viewCheckin() {
  if (!ui.ciMember || !member(ui.ciMember)) ui.ciMember = state.members[0]?.id || null;
  if (!ui.ciYm) ui.ciYm = thisYm;
  const m = member(ui.ciMember);
  if (!m) return '<section class="panel"><h2>幸せ面談</h2><div class="empty">ライフプランタブでメンバーを追加してください。</div></section>';
  const t = targetsOf(m);
  const existing = state.checkins.find(c => c.memberId === m.id && c.ym === ui.ciYm);
  const prev = checkinsOf(m.id).filter(c => c.ym < ui.ciYm).pop();
  const c = existing || { scores: prev ? { ...prev.scores } : Object.fromEntries(NEEDS.map(n => [n.key, 5])), want: '', doing: '', evaluation: '', plan: '' };
  const list = checkinsOf(m.id);
  const fy = fyOf(ui.ciYm);
  const mi = fyMonths(fy).findIndex(x => x.ym === ui.ciYm);
  const mr = mi >= 0 ? state.monthly[fy]?.[mi] : null;
  const salesNote = mr && mr.sa != null && mr.sa !== '' && n0(mr.sb) ? `この月の売上達成率 ${pct(n0(mr.sa) / n0(mr.sb) * 100)}（実績 ${manU(mr.sa)}）` : 'この月の売上実績は未入力';
  return `
  <section class="panel">
    <div class="panel-head"><h2>幸せ面談</h2><span class="muted small">月1回、数字と心を同じテーブルで振り返る</span></div>
    <div class="form-row">
      <label class="field">面談する人<select id="ci-member" data-ui="ciMember">${state.members.map(x => `<option value="${x.id}" ${x.id === m.id ? 'selected' : ''}>${esc(x.name)}（${esc(x.role)}）</option>`).join('')}</select></label>
      <label class="field">対象月<input id="ci-ym" type="month" data-ui="ciYm" value="${ui.ciYm}"></label>
      <div class="field" style="align-content:end"><span class="pill ${existing ? 'good' : ''}">${existing ? '記録済み・変更は自動保存' : prev ? '新規（前回のスコアを表示中）' : '新規'}</span></div>
    </div>
    <p class="hint">${salesNote}。数字の結果と、5つの欲求の満たされ方を並べて見ます。</p>
  </section>

  <section class="grid-2">
    <div class="panel">
      <h2>5つの欲求の充足度</h2>
      <div style="display:grid; gap:10px">
        ${NEEDS.map(n => `<div class="slider-row">
          <span style="display:inline-flex;gap:6px;align-items:center"><span class="need-dot" style="background:${n.color}"></span><strong>${n.label}</strong></span>
          <input id="ci-s-${n.key}" type="range" min="0" max="10" step="1" value="${n0(c.scores[n.key])}" data-score="${n.key}" aria-label="${n.label}の充足度">
          <span class="score"><span id="sv-${n.key}">${n0(c.scores[n.key])}</span><small class="muted"> / 目標${t[n.key]}</small></span>
        </div>
        <p class="small muted" style="margin-top:-6px">${esc(m.vision?.[n.key]?.metric || n.desc)}</p>`).join('')}
      </div>
      <p>幸福指数 <strong style="font-size:1.3rem" id="ci-index">${happy(c.scores).toFixed(0)}</strong> <span class="muted">/ 100</span></p>
    </div>
    <div class="panel">
      <h2>目標とのギャップ</h2>
      <div id="ci-radar">${radarSvg(c.scores, t, 300)}</div>
      <p class="small muted">点線＝ライフプランの目標スコア。いちばん凹んでいる欲求から、来月の行動を決めます。</p>
    </div>
  </section>

  <section class="panel">

  <section class="panel">
    <div class="panel-head"><h2>バランスシートの目標</h2><span class="muted small">単位：万円。純資産は「資産 − 負債」で自動計算。損益は経営計画の数字を使います。</span></div>
    <div class="table-scroll"><table>
      <thead><tr><th></th>${cols.map(c => `<th class="num">${c.key === 'actual' ? `<input id="bs-actual-label" data-bind="bs.actual.label" value="${esc(c.data.label || '')}" style="min-width:140px;text-align:right">` : esc(c.label)}</th>`).join('')}</tr></thead>

        <tr><th>参考債務者区分</th>${rs.map(x => { const d = debtorClass(x); return `<td class="num"><span class="pill ${d.tone}">${d.label}</span></td>`; }).join('')}</tr>

  <section class="grid-2">

      <div class="panel-head"><h2>${esc(sel.label)} の格付け内訳</h2><span class="pill ${gradeTone(r.grade)}">${r.grade} ・ ${r.score}点</span></div>
      ${groups.map(g => `<div style="display:grid;gap:8px"><h3>${g}</h3>${r.items.filter(x => x.group === g).map(x => `

          <span class="small">${x.label}　<strong>${fmtItem(x, x.value)}</strong></span><span class="small num">${x.pts} / ${x.max}</span>
          <div class="bar" style="grid-column:1/-1"><span style="width:${x.pts / x.max * 100}%;background:${x.pts / x.max >= .7 ? 'var(--good)' : x.pts / x.max >= .4 ? 'var(--warn)' : 'var(--bad)'}"></span></div>
        </div>`).join('')}</div>`).join('')}
    </div>
    <div class="panel">
      <h2>格付けを上げるために</h2>
      <p>銀行の評価：<strong>${GRADE_NOTE[r.grade]}</strong>。${r.toNext > 0 ? `あと <strong>${r.toNext}点</strong> で格付け ${r.grade - 1} です。` : r.grade === 1 ? '最上位です。' : '定量スコアは上の格付けに届いていますが、債務超過・赤字の解消が先です。'}</p>
      <ul class="alerts">${weak.map(x => `<li><span class="sev warn">${x.group}</span><span><strong>${x.label}</strong>（現在 ${fmtItem(x, x.value)}）：${nextStep(x, x.value)}。${{
        equityRatio: '利益を残して純資産を積む、遊休資産を売却して総資産を圧縮する。',

function viewIns() {
  if (!ui.insMember || !member(ui.insMember)) ui.insMember = state.members[0]?.id || null;
  const m = member(ui.insMember);
  if (!m) return '<section class="panel"><h2>保険診断</h2><div class="empty">ライフプランタブでメンバーを追加してください。</div></section>';
  m.ins ??= defaultIns();
  const idx = state.members.indexOf(m), b = `members.${idx}.ins`, c = insCalc(m), i = c.i;
  const num = (k, label, step) => `<label class="field">${label}<input id="ins-${k}" type="number" ${step ? `step="${step}"` : ''} data-num data-bind="${b}.${k}" value="${esc(i[k])}"></label>`;
  const chk = (k, label) => `<label class="field" style="grid-auto-flow:column;justify-content:start;align-items:center;gap:8px;color:var(--ink)"><input id="ins-${k}" type="checkbox" data-bool data-bind="${b}.${k}" ${i[k] ? 'checked' : ''}>${label}</label>`;
  const gapBox = (title, need, cover, rows) => {
    const gap = cover - need, max = Math.max(need, cover, 1);
    return `<div class="panel">
      <div class="panel-head"><h2>${title}</h2><span class="pill ${gap < 0 ? 'bad' : gap > need * 0.3 && need > 0 ? 'warn' : 'good'}">${gap < 0 ? `${man(-gap)}万円 不足` : gap > need * 0.3 && need > 0 ? `${man(gap)}万円 過剰` : '適正'}</span></div>
      <div style="display:grid;gap:6px">
        <div class="small">必要保障額 <strong>${manU(need)}</strong></div><div class="bar"><span style="width:${need / max * 100}%;background:var(--muted)"></span></div>
        <div class="small">現在の死亡保障 <strong>${manU(cover)}</strong></div><div class="bar"><span style="width:${cover / max * 100}%;background:${gap < 0 ? 'var(--bad)' : 'var(--accent)'}"></span></div>
      </div>
      <table><tbody>${rows.map(([l, v, cls]) => `<tr class="${cls || ''}"><th>${l}</th><td class="num">${v}</td></tr>`).join('')}</tbody></table>
    </div>`;
  };
  const allCorpPrem = state.policies.filter(x => x.owner === 'corp').reduce((s, x) => s + n0(x.premium), 0);
  const p = planFor(n0(state.company.currentFY)), op = p ? planCalc(p).op : 0;
  const props = insProposals(m);
  if (op > 0 && allCorpPrem / op > 0.3) props.push(['warn', `会社全体の法人保険料 年${manU(allCorpPrem)} は計画営業利益の ${pct(allCorpPrem / op * 100)}。30%を超えると内部留保と格付けを圧迫します。`]);
  return `
  <section class="panel">
    <div class="panel-head"><h2>生命保険の適正化診断</h2><span class="muted small">ライフプランと会社の財務から必要保障額を出し、今の契約と比べます</span></div>
    <div class="member-tabs">${state.members.map(x => `<button class="member-tab" data-action="ins-member" data-id="${x.id}" aria-pressed="${x.id === m.id}"><strong>${esc(x.name)}</strong><small>${esc(x.role)}・${ageIn(x, today.getFullYear())}歳</small></button>`).join('')}</div>
  </section>

  <section class="grid-2">
    <div class="panel">
      <h2>家族（個人）の前提</h2>
      <div class="form-row">
        ${num('survivorYears', '遺族の生活期間（年）')}${num('survivorRate', '遺族の生活費（現在比 %）')}
        ${num('education', '残りの教育費（万円）')}${num('mortgage', '住宅ローン残高（万円）')}
        ${num('savings', '預貯金・金融資産（万円）')}${num('pension', '遺族年金（年額・万円）')}${num('funeral', '葬儀・整理資金（万円）')}
      </div>
      ${chk('danshin', '住宅ローンは団体信用生命保険で完済される')}
    </div>
    <div class="panel">
      <h2>会社（法人）の前提</h2>
      <div class="form-row">
        ${num('yearsInOffice', '役員在任年数（死亡時想定）')}${num('merit', '功績倍率', '0.1')}${num('bizMonths', '事業保障（固定費の月数）')}
      </div>
      ${chk('guarantor', '会社借入の経営者保証人になっている')}
      <p class="small muted">死亡退職金 = 最終報酬月額 × 在任年数 × 功績倍率（社長3.0、専務2.5、取締役2.0が目安）。弔慰金は業務外死亡の報酬6か月分。経営者保証ありの場合は直近決算の有利子負債 ${manU(n0(state.bs.actual.shortDebt) + n0(state.bs.actual.longDebt))} を必要額に含めます。</p>
    </div>
  </section>

  <section class="grid-2">
    ${gapBox('法人で備える保障', c.corpNeed, c.corpCover, [
      ['死亡退職金', manU(c.retire)], ['弔慰金', manU(c.condolence)], ['事業保障（固定費 × 月数）', manU(c.biz)], ['借入金の返済（経営者保証）', manU(c.debt)],
      ['必要保障額', manU(c.corpNeed), 'total'], ['法人契約の保険料（年）', manU(c.corpPremium)], ['法人契約の解約返戻金', manU(c.corpCash)]])}
    ${gapBox('家族のための保障', c.personalNeed, c.personalCover, [
      ['遺族の生活費', manU(c.living)], ['教育費', manU(i.education)], ['住宅ローン', i.danshin ? '団信で完済' : manU(i.mortgage)], ['葬儀・整理資金', manU(i.funeral)],

      ['必要保障額', manU(c.personalNeed), 'total'], ['個人契約の保険料（年）', manU(c.personalPremium)]])}

function varianceAndLanding(fy) {
  const rows = monthlyRows(fy), months = fyMonths(fy), y = ytd(fy);
  const vs = rows.map(variance);
  const sum = k => vs.reduce((s, v) => s + (v ? v[k] : 0), 0);
  const tot = { vol: sum('vol'), mix: sum('mix'), fix: sum('fix'), total: sum('total') };
  const factors = [['vol', '売上の増減（数量）', '売上が予算に届かなかった分、粗利が減りました。受注残と営業の動きを確認しましょう。', '売上が予算を上回り、粗利が増えました。'], ['mix', '粗利率の変化', '粗利率が予算を下回っています。原価・外注費・値引きの管理を見直しましょう。', '粗利率が予算を上回っています。'], ['fix', '固定費の増減', '経費・人件費が予算を超えています。', '固定費が予算内に収まり、利益を押し上げました。']];
  const worst = factors.map(f => ({ f, v: tot[f[0]] })).sort((a, b) => a.v - b.v)[0];
  const maxAbs = Math.max(1, ...factors.map(f => Math.abs(tot[f[0]])), Math.abs(tot.total));

const ORG_STATUS = ['在任', '登用予定', '採用予定'];
const plannedComp = (m, y) => { const v = state.org?.comp?.[m.id]?.[y]; return v == null || v === '' ? n0(m.currentComp) : n0(v); };
const lastScores = id => [...state.checkins].filter(c => c.memberId === id).sort((a, b) => a.ym < b.ym ? -1 : 1).at(-1)?.scores;
function orgRoots(nodes) {
  const ids = new Set(nodes.map(n => n.id));
  return nodes.filter(n => !n.parent || !ids.has(n.parent) || n.parent === n.id);
}
const orgKids = (nodes, id) => nodes.filter(n => n.parent === id && n.id !== id);
function orgDesc(nodes, id, seen = new Set()) {
  orgKids(nodes, id).forEach(k => { if (!seen.has(k.id)) { seen.add(k.id); orgDesc(nodes, k.id, seen); } });
  return seen;
}
function orgPresident(nodes) {

function orgCalc() {
  const o = state.org, fy = n0(state.company.currentFY), Y = Math.max(fy, n0(o.idealYear) || fy + 4);
  const staffCost = nodes => nodes.reduce((s, n) => s + (n.memberId ? 0 : n0(n.people) * n0(n.comp)), 0);
  const heads = nodes => nodes.reduce((s, n) => s + (n.memberId ? 1 : n0(n.people)), 0);
  const memberCost = (nodes, y) => nodes.filter(n => n.memberId && member(n.memberId)).reduce((s, n) => s + plannedComp(member(n.memberId), y), 0);
  const staffCur = staffCost(o.current), staffIdeal = staffCost(o.ideal);
  // 採用・登用の年度が決まっているポジションはその年度から、残りの差は目標年度に向けて均等に積み上げる
  const timed = o.ideal.filter(n => !n.memberId && n.status !== '在任' && n0(n.year));
  const timedCost = y => timed.filter(n => y >= n0(n.year)).reduce((s, n) => s + n0(n.people) * n0(n.comp), 0);
  const base = staffIdeal - timed.reduce((s, n) => s + n0(n.people) * n0(n.comp), 0) - staffCur;
  const ramp = y => (Y > fy ? base * Math.max(0, Math.min(1, (y - fy) / (Y - fy))) : (y >= Y ? base : 0)) + timedCost(y);
  // 社員（ライフプラン登録の幹部以外）の人数と人件費。人数・昇給率は年度ごとに上書きできる
  const frac = y => Y > fy ? Math.max(0, Math.min(1, (y - fy) / (Y - fy))) : (y >= Y ? 1 : 0);
  const staffHeads = nodes => nodes.reduce((s, n) => s + (n.memberId ? 0 : n0(n.people)), 0);
  const hCur = staffHeads(o.current), hIdeal = staffHeads(o.ideal);
  const timedHeads = y => timed.filter(n => y >= n0(n.year)).reduce((s, n) => s + n0(n.people), 0);
  const baseH = hIdeal - timed.reduce((s, n) => s + n0(n.people), 0) - hCur;
  const headsOrg = y => hCur + baseH * frac(y) + timedHeads(y);
  const st = y => o.staff?.[y] || {};
  const raiseRate = y => st(y).raise ?? o.raiseRate ?? 2;
  const idx = y => { let k = 1; for (let t = fy + 1; t <= y; t++) k *= 1 + n0(raiseRate(t)) / 100; return k; };
  const staffN = y => st(y).heads ?? Math.round(headsOrg(y));
  const avgPay = y => { const h = headsOrg(y); return (h > 0 ? (staffCur + ramp(y)) / h : 0) * idx(y); };
  const staffPay = y => staffN(y) * avgPay(y);
  const staffDelta = y => staffPay(y) - staffCur;
  const execs = state.members.filter(m => m.compKind !== 'salary'), salaried = state.members.filter(m => m.compKind === 'salary');
  const execSum = y => execs.reduce((s, m) => s + plannedComp(m, y), 0);
  const raise = y => salaried.reduce((s, m) => s + plannedComp(m, y) - n0(m.currentComp), 0);
  const adj = y => Math.round(staffDelta(y) + raise(y));
  const direct = nodes => { const p = orgPresident(nodes); return p ? orgKids(nodes, p.id).length : 0; };
  return { fy, Y, staffCur, staffIdeal, ramp, execSum, raise, adj, direct, heads, memberCost, hCur, headsOrg, raiseRate, staffN, avgPay, staffPay, staffDelta, st };
}

function orgTreeHtml(nodes, mode, year) {
  if (!nodes.length) return `<p class="muted small">まだ${mode === 'ideal' ? '理想の' : ''}組織図がありません。下の表でポジションを追加してください。</p>`;
  const seen = new Set();
  const li = n => { if (seen.has(n.id)) return ''; seen.add(n.id); const kids = orgKids(nodes, n.id).filter(k => !seen.has(k.id)); return `<li>${orgCard(n, mode, year)}${kids.length ? `<ul>${kids.map(li).join('')}</ul>` : ''}</li>`; };
  let roots = orgRoots(nodes), html = roots.map(li).join('');
  nodes.filter(n => !seen.has(n.id)).forEach(n => { html += li(n); });
  return `<div class="org-scroll"><div class="org-tree"><ul>${html}</ul></div></div>`;
}

function staffPanel(c, years) {
  const o = state.org, prevN = y => y <= c.fy ? c.hCur : c.staffN(y - 1), prevPay = y => y <= c.fy ? c.staffCur : c.staffPay(y - 1);
  const yoy = (v, b) => b ? (v / b - 1) * 100 : NaN;
  const sgn = v => isFinite(v) ? `${v > 0 ? '+' : ''}${v.toFixed(1)}%` : '—';
  const ov = Object.keys(o.staff || {}).some(y => o.staff[y] && (o.staff[y].heads != null || o.staff[y].raise != null));
  const last = years.at(-1), payUp = yoy(c.staffPay(last), c.staffCur), cagr = last > c.fy && c.staffCur ? (Math.pow(c.staffPay(last) / c.staffCur, 1 / (last - c.fy)) - 1) * 100 : NaN;
  const share = y => { const p = planFor(y); if (!p) return NaN; const gp = planCalc(p).gp; return gp ? (c.staffPay(y) + c.execSum(y)) / gp * 100 : NaN; };
  return `
  <section class="panel">
    <div class="panel-head"><h2>社員数と人件費の計画</h2>
      <div class="btn-row"><label class="field" style="flex-direction:row;align-items:center;gap:6px">標準の昇給率（%）<input id="org-raise" type="number" step="0.1" data-num data-bind="org.raiseRate" value="${esc(o.raiseRate)}" style="width:80px"></label>
      ${ov ? '<button class="btn ghost" data-action="org-staff-reset">人数・昇給率を組織図から計算し直す</button>' : ''}</div></div>
    <p class="small muted">社員は、ライフプランに登録した幹部以外の全員です（組織図の部署と、経営陣につないでいない役職）。${last}年度までに社員は ${c.hCur}名 → ${c.staffN(last)}名（${c.staffN(last) - c.hCur >= 0 ? '+' : ''}${c.staffN(last) - c.hCur}名）、社員の人件費は ${sgn(payUp)}（年平均 ${sgn(cagr)}）です。</p>
    <div class="table-scroll"><table class="wrap-th">
      <thead><tr><th></th><th class="num">現状</th>${years.map(y => `<th class="num">${y}年度</th>`).join('')}</tr></thead>
      <tbody>
        <tr><th>社員数（人）</th><td class="num">${c.hCur}</td>${years.map(y => `<td><input id="org-heads-${y}" type="number" min="0" data-num data-bind="org.staff.${y}.heads" value="${c.staffN(y)}" style="width:76px;${c.st(y).heads != null ? 'font-weight:700' : ''}"></td>`).join('')}</tr>
        <tr><th>増減（前年比）</th><td></td>${years.map(y => { const d = c.staffN(y) - prevN(y); return `<td class="num ${d > 0 ? 'pos' : d < 0 ? 'neg' : ''}">${d > 0 ? '+' : ''}${d}名</td>`; }).join('')}</tr>
        <tr><th>昇給率（%）</th><td></td>${years.map(y => y <= c.fy ? '<td class="num muted small">基準年</td>' : `<td><input id="org-rr-${y}" type="number" step="0.1" data-num data-bind="org.staff.${y}.raise" value="${c.raiseRate(y)}" style="width:76px;${c.st(y).raise != null ? 'font-weight:700' : ''}"></td>`).join('')}</tr>
        <tr><th>平均年収</th><td class="num">${man(c.hCur ? c.staffCur / c.hCur : 0)}</td>${years.map(y => `<td class="num">${man(c.avgPay(y))}</td>`).join('')}</tr>
        <tr class="link"><th>社員の人件費</th><td class="num">${man(c.staffCur)}</td>${years.map(y => `<td class="num"><strong>${man(c.staffPay(y))}</strong></td>`).join('')}</tr>
        <tr><th>人件費の上昇率（前年比）</th><td></td>${years.map(y => { const v = yoy(c.staffPay(y), prevPay(y)); return `<td class="num" style="${v >= 10 ? 'color:var(--warn);font-weight:700' : ''}">${sgn(v)}</td>`; }).join('')}</tr>
        <tr><th>人件費の上昇率（現状比）</th><td></td>${years.map(y => `<td class="num">${sgn(yoy(c.staffPay(y), c.staffCur))}</td>`).join('')}</tr>
        <tr><th>労働分配率（社員＋役員 ÷ 粗利）</th><td></td>${years.map(y => { const v = share(y); return `<td class="num" style="${v >= 60 ? 'color:var(--bad)' : v >= 50 ? 'color:var(--warn)' : ''}">${isFinite(v) ? v.toFixed(1) + '%' : '—'}</td>`; }).join('')}</tr>
        <tr><th>社員1人あたり売上</th><td></td>${years.map(y => { const p = planFor(y), n = c.staffN(y); return `<td class="num">${p && n ? man(n0(p.sales) / n) : '—'}</td>`; }).join('')}</tr>
      </tbody></table></div>
    <p class="small muted">単位：万円。人数は、組織図の現状から理想まで（採用・登用の年度が入ったポジションはその年度から）を目安に入れてあり、年度ごとに上書きできます（太字が上書きした値）。平均年収は、組織の構成から出した平均に昇給率を毎年かけています。社会保険料などの会社負担分を含めたいときは、組織図の1人あたり年収を15%ほど上乗せしてください。労働分配率は50%を超えると黄色、60%を超えると赤で表示します。</p>
  </section>`;
}

function viewOrg() {
  state.org ??= defaultOrg(n0(state.company.currentFY));

  const years = [...state.plans].map(p => n0(p.year)).sort((a, b) => a - b);
  const fyR = years.includes(c.fy) ? c.fy : years[0];
  const ok = state.members.filter(m => plannedComp(m, fyR) >= reqComp(m, fyR)).length;
  const dCur = c.direct(o.current), dIdeal = c.direct(o.ideal);

    <div class="kpi"><span class="label">人件費（幹部＋部署）</span><span class="value">${man(costCur)}${o.ideal.length ? ` → ${man(costIdeal)}` : ''}</span><span class="sub">万円・人数 ${c.heads(o.current)}名${o.ideal.length ? ` → ${c.heads(o.ideal)}名` : ''}</span></div>
    <div class="kpi ${gaps ? 'warn' : 'good'}"><span class="label">経営計画への反映</span><span class="value">${gaps ? `${gaps}年度 未反映` : '反映済み'}</span><span class="sub">年収計画・人件費の増加と経営計画の差</span></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>組織図</h2>
      <div class="btn-row"><button class="btn ${mode === 'current' ? 'primary' : 'ghost'}" data-action="org-view" data-v="current">現状</button><button class="btn ${mode === 'ideal' ? 'primary' : 'ghost'}" data-action="org-view" data-v="ideal">理想（${c.Y}年度）</button>
      ${mode === 'ideal' ? `<label class="field" style="flex-direction:row;align-items:center;gap:6px">目標年度<input id="org-year" type="number" data-num data-bind="org.idealYear" value="${esc(o.idealYear)}" style="width:90px"></label>` : ''}</div></div>
    ${orgTreeHtml(o[mode], mode, mode === 'ideal' ? c.Y : c.fy)}
    <div class="org-legend small muted"><span><i class="lg member"></i>経営陣（ライフプランあり）</span><span><i class="lg promote"></i>登用予定</span><span><i class="lg hire"></i>採用予定</span></div>
    ${notes.length ? `<div class="hint">${notes.map(t => `<div>${t}</div>`).join('')}</div>` : ''}

        <td><select id="org-kind-${i}" data-bind="members.${i}.compKind"><option value="exec" ${m.compKind !== 'salary' ? 'selected' : ''}>役員報酬</option><option value="salary" ${m.compKind === 'salary' ? 'selected' : ''}>給与（販管費）</option></select></td>
        ${years.map(y => { const r = reqComp(m, y), v = plannedComp(m, y); return `<td><input id="org-comp-${i}-${y}" type="number" data-num data-bind="org.comp.${m.id}.${y}" value="${v}" style="width:92px;${v < r ? 'border-color:var(--bad)' : ''}"><div class="small ${v < r ? 'neg' : 'muted'}" style="text-align:right;${v < r ? 'color:var(--bad)' : ''}">必要 ${man(r)}</div></td>`; }).join('')}</tr>`).join('')}
        <tr class="link"><th colspan="2">役員報酬の合計（年収計画）</th>${rowTd(c.execSum)}</tr>
        <tr><th colspan="2">いまの経営計画の役員報酬</th>${years.map(y => { const p = planFor(y), d = c.execSum(y) - n0(p?.execComp); return `<td class="num">${man(p?.execComp)}${Math.abs(d) >= 1 ? `<div class="small" style="color:var(--warn)">差 ${d > 0 ? '+' : ''}${man(d)}</div>` : ''}</td>`; }).join('')}</tr>
        <tr><th colspan="2">給与で払う幹部の昇給</th>${rowTd(c.raise)}</tr>
        <tr><th colspan="2">社員の人件費の増加（現状比）</th>${rowTd(y => Math.round(c.staffDelta(y)))}</tr>
        <tr class="link"><th colspan="2">販管費に上乗せする額</th>${years.map(y => { const p = planFor(y), d = c.adj(y) - n0(p?.orgSgaAdj); return `<td class="num"><strong>${man(c.adj(y))}</strong>${Math.abs(d) >= 1 ? `<div class="small" style="color:var(--warn)">反映済み ${man(p?.orgSgaAdj)}</div>` : ''}</td>`; }).join('')}</tr>
        <tr class="link"><th colspan="2">年収と人件費の増加を粗利で賄うのに必要な売上</th>${years.map(y => { const p = planFor(y); if (!p) return '<td></td>'; const gr = n0(p.grossRate) / 100, need = gr > 0 ? n0(p.sales) + (c.adj(y) + c.execSum(y) - n0(p.execComp)) / gr : NaN; return `<td class="num"><strong>${man(need)}</strong><div class="small ${need > n0(p.sales) ? '' : 'muted'}" style="${need > n0(p.sales) ? 'color:var(--warn)' : ''}">計画 ${man(p.sales)}</div></td>`; }).join('')}</tr>
        <tr><th colspan="2">反映後の営業利益</th>${years.map(y => { const p = planFor(y); if (!p) return '<td></td>'; const op = planCalc(p).op - (c.execSum(y) - n0(p.execComp)) - (c.adj(y) - n0(p.orgSgaAdj)); return `<td class="num ${op < 0 ? 'neg' : ''}"><strong>${man(op)}</strong><div class="small muted">${pct(n0(p.sales) ? op / n0(p.sales) * 100 : NaN)}</div></td>`; }).join('')}</tr>
      </tbody></table></div>` : '<p class="muted">ライフプランに経営陣を登録すると、年収計画を立てられます。</p>'}
    <p class="small muted">「必要」は各幹部のライフプラン（生活費・貯蓄目標・その年のイベント）を手取り率で割り戻した年収です。社員の人件費の増加は、上の「社員数と人件費の計画」から計算しています。「経営計画に反映」を押すと、各年度の役員報酬を年収計画の合計に置き換え、販管費には上乗せ額の差分だけを足し引きします（何度押しても二重に足されません）。</p>

function render() {

function commit(msg) { stateRev++; save(); scheduleCloud(); render(); if (msg) toast(msg); }

function upsertCheckin() {
  const m = member(ui.ciMember); if (!m) return null;
  let c = state.checkins.find(x => x.memberId === m.id && x.ym === ui.ciYm);
  if (!c) {
    c = { memberId: m.id, ym: ui.ciYm, scores: {}, want: '', doing: '', evaluation: '', plan: '' };
    NEEDS.forEach(n => { c.scores[n.key] = n0(document.getElementById('ci-s-' + n.key)?.value ?? 5); });
    ['want', 'doing', 'evaluation', 'plan', 'advisorNote'].forEach(k => { const el = document.querySelector(`[data-ci="${k}"]`); if (el) c[k] = el.value; });
    state.checkins.push(c);
  }
  return c;
}

document.addEventListener('toggle', e => { if (e.target.matches?.('[data-orgedit]')) ui.orgEdit = e.target.open; }, true);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.score) {
    $('#sv-' + t.dataset.score).textContent = t.value;
    const scores = Object.fromEntries(NEEDS.map(n => [n.key, n0(document.getElementById('ci-s-' + n.key).value)]));
    $('#ci-index').textContent = happy(scores).toFixed(0);
    $('#ci-radar').innerHTML = radarSvg(scores, targetsOf(member(ui.ciMember)), 300);
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bind) {
    const v = t.hasAttribute('data-bool') ? t.checked : t.hasAttribute('data-num') ? (t.value === '' ? null : +t.value) : t.value;
    setPath(state, t.dataset.bind, v);
    commit();
  } else if (t.dataset.obind) {
    const v = t.hasAttribute('data-bool') ? t.checked : t.hasAttribute('data-num') ? (t.value === '' ? null : +t.value) : t.value;
    setPath(office, t.dataset.obind, v); office.sample = false;
    saveOffice(); render();
  } else if (t.dataset.uibool) {
    ui[t.dataset.uibool] = t.checked; render();
  } else if (t.dataset.pfadvisor) {
    const id = t.dataset.pfadvisor, v = t.value.trim();
    const pc = portfolioClients().find(c => c.id === id);
    if (pc?.current) { state.company.advisor = v; commit('担当者を設定しました'); }
    else if (cloud.db && !cloud.readOnly) cloud.db.doc('clients/' + id).update({ data: { company: { advisor: v } }, updatedAt: Date.now(), session: SESSION }).then(() => toast('担当者を設定しました'), () => toast('担当者を保存できませんでした'));
  } else if (t.dataset.client !== undefined && t.id === 'client-select') {
    const doc = cloud.clients.find(c => c.id === t.value);
    if (!doc) return;
    clearTimeout(cloud.timer); cloud.pending = false; cloud.msg = '';

    }
    case 'del-client': {
      if (!arm('del-client')) { renderCloudBar(); return; }
      const id = ui.clientId; ui.clientId = null; saveUi();
      cloud.db?.doc('clients/' + id).delete().then(() => toast('共有から削除しました（このブラウザには残っています）'), () => toast('削除できませんでした'));
      render(); break;
    }
    case 'adopt': {
      const i = +b.dataset.i;
      if (!arm('adopt-' + i)) return;
      const pb = patternBudget(ui.fy, state.cf.patterns[i]); if (!pb) return;
      monthlyRows(ui.fy).forEach((r, k) => { r.sb = pb.months[k].sales; r.gb = pb.months[k].gp; r.ob = pb.months[k].op; });
      commit(`「${pb.pt.label}」を${ui.fy}年度の月次予算にしました`); break;
    }
    case 'imp-sample': {
      const k = b.dataset.kind;
      try { importDraft = { files: [parseTable(sampleCsv(k), k === 'yayoi' ? '推移試算表_サンプル.csv' : '推移表_サンプル.csv')] }; ui.impMap = {}; ui.impFy = n0(state.company.currentFY); } catch (e) { toast(e.message); }
      render(); break;
    }
    case 'imp-clear': importDraft = null; render(); break;
    case 'imp-apply': {
      const bb = buildImport(importDraft.files, ui.impFy, ui.impUnit || 10000, ui.impMap || {});
      applyImport(bb); break;
    }
    case 'imp-undo': if (importUndo) { state = migrate(JSON.parse(importUndo)); importUndo = null; commit('取り込み前に戻しました'); } break;
    case 'report-preview': ui.showReport = !ui.showReport; render(); break;
    case 'report-save': saveReport(); break;
    case 'del-plan': state.plans.splice(+b.dataset.i, 1); commit('削除しました'); break;
    case 'spread': {
      if (!arm('spread')) return;
      const p = planFor(ui.fy); if (!p) return;
      const rows = monthlyRows(ui.fy);
      const sb = n0(p.sales) / 12, gb = sb * n0(p.grossRate) / 100, ob = gb - (n0(p.sga) + n0(p.execComp)) / 12;
      rows.forEach(r => { r.sb = Math.round(sb); r.gb = Math.round(gb); r.ob = Math.round(ob); });
      commit('予算を按分しました'); break;
    }
    case 'save-checkin': {
      const m = member(ui.ciMember); if (!m) return;
      const c = upsertCheckin();
      NEEDS.forEach(n => { c.scores[n.key] = n0(document.getElementById('ci-s-' + n.key).value); });
      ['want', 'doing', 'evaluation', 'plan', 'advisorNote'].forEach(k => { c[k] = document.querySelector(`[data-ci="${k}"]`).value; });
      commit(`${ymLabel(ui.ciYm)}の面談を記録しました`); break;
    }
    case 'del-checkin': {
      if (!arm('del-ci')) return;
      state.checkins = state.checkins.filter(c => !(c.memberId === ui.ciMember && c.ym === ui.ciYm));
      commit('削除しました'); break;
    }
    case 'open-ci': ui.ciYm = b.dataset.ym; render(); window.scrollTo(0, 0); break;
    case 'export': $('#io-text').value = JSON.stringify(state, null, 1); toast('書き出しました。コピーして保存してください'); break;
    case 'copy': {
      const ta = $('#io-text'); if (!ta.value) ta.value = JSON.stringify(state, null, 1);
      navigator.clipboard?.writeText(ta.value).then(() => toast('コピーしました'), () => { ta.select(); toast('選択しました。Ctrl+C でコピーしてください'); })
        ?? (ta.select(), toast('選択しました。Ctrl+C でコピーしてください'));
      break;
    }
    case 'import': importText($('#io-text').value); break;
    case 'blank': if (!arm('blank')) return; state = blankState(); ui.lifeMember = ui.ciMember = null; commit('空の状態にしました'); break;
    case 'sample': if (!arm('sample')) return; state = sampleState(); ui.lifeMember = ui.ciMember = null; commit('サンプルデータに戻しました'); break;
  }
});

render();
initCloud();
getSample().then(s => { ai.available = !!s; });
})();
</script>
</body>
</html>
